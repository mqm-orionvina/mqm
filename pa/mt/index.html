function shrink(file, max, q) {
  return new Promise((res, rej) => { const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => { const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('Không đọc được ảnh')); }; img.src = url; });
}

// ---------- hàng chờ gửi nền (IndexedDB) ----------
const DB = (() => { let p; const open = () => p || (p = new Promise((res, rej) => { const r = indexedDB.open('productAgeMT', 1); r.onupgradeneeded = () => r.result.createObjectStore('q', { keyPath: 'id' }); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }));
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction('q', mode), s = t.objectStore('q'), r = fn(s); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); };
  return { put: v => tx('readwrite', s => s.put(v)), del: id => tx('readwrite', s => s.delete(id)), all: () => tx('readonly', s => s.getAll()) }; })();
let busy = false, lastErr = '', sentNow = 0;
const TRANSIENT = /khóa|khoá|lock|API không hợp lệ|Service|timed? ?out|quá trình|Exception|Lỗi không rõ|Too many|quota|thử lại/i;
function markSent(it) { if (!it.mark) return; const all = LS.get('done', {}), d = all[it.mark.sk]; if (d && d[it.mark.key] && d[it.mark.key].id === it.id) { d[it.mark.key].st = 'ok'; LS.set('done', all); } }
async function pump() {
  if (busy) return; busy = true;
  try {
    for (;;) {
      const all = await DB.all(), items = all.filter(x => !x.failed).sort((a, b) => a.t - b.t);
      paintQ(items.length, all.filter(x => x.failed)); if (!items.length) break;
      const it = items[0]; let r;
      try { r = await (await fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: 'paSubmit', data: it.data }) })).json(); }
      catch (e) { lastErr = navigator.onLine ? 'Chưa gửi được, đang thử lại…' : 'Mất mạng – sẽ tự gửi khi có mạng'; paintQ(items.length, all.filter(x => x.failed)); setTimeout(() => { busy = false; pump(); }, 8000); return; }
      lastErr = '';
      if (r && r.ok) { await DB.del(it.id); sentNow++; markSent(it); if (st.screen === 'list') renderList(); }
      else { const er = (r && r.error) || 'Lỗi không rõ';
        // lỗi tạm thời của máy chủ (bận / khoá / mất nội dung khi chuyển hướng) → tự gửi lại, không bắt Salesman bấm (10/11)
        if (TRANSIENT.test(er) && (it.tries = (it.tries || 0) + 1) <= 20) { await DB.put(it); lastErr = 'Máy chủ đang bận, tự gửi lại sau ít giây…'; paintQ(items.length, all.filter(x => x.failed)); setTimeout(() => { busy = false; pump(); }, 10000); return; }
        it.failed = er; await DB.put(it); }
    }
  } finally { busy = false; }
  paintQ(0);
}
async function paintQ(n, fl) {
  const fails = fl || (await DB.all()).filter(x => x.failed); let h = '';
  if (n) h = `<div class="qbar ${lastErr ? 'err' : 'go'}"><i></i>${lastErr || `Đang gửi ${n} mẫu… cứ nhập tiếp`}</div>`;
  else if (sentNow) h = `<div class="qbar ok"><i></i>Đã gửi xong ${sentNow} mẫu ✓</div>`;
  if (fails.length) h += `<div class="fails">${fails.map(x => `<div><span>${esc(x.label || x.data.brand)} · ${esc(x.failed)}</span><button data-retry="${x.id}" class="rt">Gửi lại</button><button data-drop="${x.id}">Bỏ</button></div>`).join('')}</div>`;
  $('#q').innerHTML = h;
}
addEventListener('online', () => pump()); setInterval(() => pump(), 30000);

// ---------- sự kiện ----------
let logoutArm = false;
function enterShop(n) { syncMine(); st.shop = n; st.pickShop = 0; LS.set('lastShop', n); go('list'); renderList(true); }
function logout() { LS.set('chan', ''); ['center', 'name', 'office', 'lastShop'].forEach(k => LS.set(k, k === 'office' ? null : k === 'lastShop' ? 0 : ''));
  st = { screen: 'center', center: '', name: '', office: null, q: '', shop: 0, pickShop: 0, item: null }; logoutArm = false; go('center'); toast('Đã đăng xuất · dữ liệu đã lưu vẫn được gửi'); }
function openItem(k) {
  const d = getDone(), v = d[k];
  if (k.includes('|Khác:')) { toast('Mẫu này đã lưu'); return; }
  const it = ITEMS.find(x => x.k === k);
  if (v && v !== 'na' && !confirmRedo(k)) return;
  f = loadDraft(k) || { it, other: '', size: it.other ? '' : it.size, mfd: '', mfdOld: '', photo: null, thumb: null, photo2: null, thumb2: null };
  go('item');
}
let redoArm = '';
function confirmRedo(k) { if (redoArm === k) { redoArm = ''; return true; } redoArm = k; toast('Mẫu này đã lưu. Bấm lần nữa để nhập lại (bản mới thay bản cũ)'); setTimeout(() => { if (redoArm === k) redoArm = ''; }, 4000); return false; }
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'back') { if (st.screen === 'shop') return; go(st.screen === 'item' ? 'list' : st.screen === 'list' ? 'shop' : st.screen === 'office' ? 'name' : 'center'); if (st.screen === 'list') renderList(true); return; }
  if (t.id === 'chanTT') { LS.set('chan', 'TT'); render(); return; }
  if (t.id === 'chanMT') { location.href = 'mt/'; return; }
  if (t.id === 'chanReset') { LS.set('chan', ''); render(); return; }
  if (t.dataset.c) { st.center = t.dataset.c; st.q = ''; LS.set('center', st.center); go('name'); return; }
  if (t.dataset.o) { const c = MASTER.centers.find(x => x.center === st.center), o = c.offices.find(o => o.code === t.dataset.o); st.office = { code: o.code, name: o.name }; LS.set('office', st.office); st.pickShop = 0; go('shop'); return; }
  if (t.dataset.shop) { const n = +t.dataset.shop; if (shopType(n) && st.pickShop !== n && Object.keys(getDone(n)).length) { enterShop(n); return; } st.pickShop = n; render(); const tp = $('.pickbox'); if (tp) window.scrollTo(0, tp.getBoundingClientRect().top + scrollY - 70); return; }
  if (t.id === 'storeOk' || t.id === 'storeBk') { const x = t.id === 'storeBk' ? stOf(st.pickShop).bk : stOf(st.pickShop); setShopType(`${x.code} · ${x.name}${t.id === 'storeBk' ? ' (dự phòng)' : ''}`, st.pickShop); enterShop(st.pickShop); return; }
  if (t.id === 'logout') { if (logoutArm) { logout(); } else { logoutArm = true; t.textContent = 'Bấm lần nữa để đăng xuất'; setTimeout(() => { logoutArm = false; const b = $('#logout'); if (b) b.textContent = 'Đăng xuất'; }, 3500); } return; }
  if (t.dataset.nm) { st.name = t.dataset.nm; render(); return; }
  if (t.id === 'nameOk') { if (st.name.trim().length < 2) { toast('Nhập họ tên trước'); return; } st.name = st.name.trim().replace(/\s+/g, ' '); LS.set('name', st.name); const ns = LS.get('names', []).filter(x => x !== st.name); ns.unshift(st.name); LS.set('names', ns.slice(0, 5)); st.q = ''; go('office'); return; }
  if (t.id === 'toShops' || t.id === 'finish') { st.pickShop = 0; go('shop'); return; }
  if (t.dataset.it) { openItem(t.dataset.it); return; }
  if (t.dataset.sz) { f.size = t.dataset.sz; renderItem(); return; }
  if (t.dataset.re || t.dataset.cam) { openCam(+(t.dataset.re || t.dataset.cam)); return; }
  if (t.id === 'camshot') { snap(); return; }
  if (t.id === 'inappx') { $('#inapp').hidden = true; try { sessionStorage.setItem('pamt.inappx', '1'); } catch (e) {} return; }
  if (t.id === 'camx') { $('#camov').hidden = true; return; }
  if (t.dataset.drop) { await DB.del(t.dataset.drop); paintQ(0); return; }
  if (t.dataset.retry) { const x = (await DB.all()).find(y => y.id === t.dataset.retry); if (x) { delete x.failed; x.tries = 0; await DB.put(x); } pump(); return; }
  if (t.id === 'na') { dropDraft(); setDone(f.it.k, 'na'); toast(`${f.it.label}: không có trên kệ`); go('list'); renderList(true); return; }
  if (t.id === 'save') {
    const m = missing(); if (m.length) { toast('Còn thiếu: ' + m.join(', ')); return; }
    const it = f.it, today = TODAY(), id = uid(), flavor = it.other ? 'Khác: ' + f.other.trim() : it.flavor;
    const key = it.other ? `${it.brand}|Khác:${f.other.trim()}|${f.size}` : it.k, sk = shopKey();
    const data = { id, clientAt: new Date().toISOString(), center: st.center, office: `${st.office.code} · ${st.office.name}`, brand: it.brand, flavor, size: f.size,
      mfd: f.mfd, mfdOld: f.mfdOld, shop: st.shop, shopType: shopType(), buyDate: today, photo: f.photo, photo2: f.photo2,   /* không gửi thumbnail: Sheet nhẹ, Tracker đọc nhanh (09/11) */ device: DEVICE, sales: st.name, item: it.other ? 'khac' : String(it.no) };
    const label = it.other ? `${it.B.n} ${f.other.trim()} ${f.size === 'Small' ? 'Small (nhỏ)' : 'Normal (vừa)'}` : it.label;
    await DB.put({ id, t: Date.now(), data, label, mark: { sk, key } });
    setDone(key, { a1: ageOf(f.mfd), a2: ageOf(f.mfdOld), st: 'q', id, nm: label });
    toast(`Đã lưu ${label} · tuổi ${ageOf(f.mfd)} / ${ageOf(f.mfdOld)} ngày`);
    f = null; dropDraft(); go('list'); renderList(true); pump();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'qs') { st.q = e.target.value; paintOffices(); }
  if (e.target.id === 'nm') { st.name = e.target.value; paintNameBar(); }
  if (e.target.id === 'other') { f.other = e.target.value; paintSave(); }
});
document.addEventListener('change', async e => {
  if (e.target.dataset && e.target.dataset.dp && f) { const n = +e.target.dataset.dp; dpOf(n)[e.target.dataset.k] = e.target.value; e.target.classList.toggle('empty', !e.target.value); setDP(n); paintPacks(); saveDraft(); return; }
  if ((e.target.id === 'cam1' || e.target.id === 'cam2') && e.target.files[0]) {
    const file = e.target.files[0], two = e.target.id === 'cam2', y = scrollY;
    try { const lb = e.target.closest('.shot'); if (lb) lb.style.opacity = '.5'; const r = await shrinkAll(file);
      setPhoto(two ? 2 : 1, r); saveDraft(); renderItem(); window.scrollTo(0, y); }
    catch (err) { toast(err.message); }
  }
});

// từ app MT bấm "Đổi kênh" (?chan=1): hiện lại màn chọn TT / MT
if (/[?&]chan=1/.test(location.search)) { LS.set('chan', ''); history.replaceState(null, '', location.pathname); }
// mở lại app: vào thẳng danh sách shop của Office đã chọn lần trước
if (st.center && st.name && st.office && MASTER.centers.some(c => c.center === st.center)) st.screen = 'shop';
else if (st.center && st.name && MASTER.centers.some(c => c.center === st.center)) st.screen = 'office';
else if (st.center && MASTER.centers.some(c => c.center === st.center)) st.screen = 'name';
if (st.screen === 'shop') { try { const d = JSON.parse(sessionStorage.getItem(DRAFT) || 'null'); if (d && d.shop && shopType(d.shop) && d.sk === shopKey(d.shop)) { st.shop = d.shop; const df = loadDraft(d.it); if (df) { f = df; st.screen = 'item'; } } } catch (e) {} }
// iPhone mở trong Zalo / Facebook: camera trong trang không chạy → nhắc mở bằng Safari (Android vẫn chụp trong app bình thường)
try { if (/iPhone|iPad|iPod/i.test(navigator.userAgent) && !inlineOK && !sessionStorage.getItem('pamt.inappx')) $('#inapp').hidden = false; } catch (e) {}
DB.all().then(xs => Promise.all(xs.filter(x => x.failed && TRANSIENT.test(x.failed)).map(x => { delete x.failed; x.tries = 0; return DB.put(x); }))).catch(() => {}).then(() => pump());
render();
// tự cập nhật: GitHub Pages / trình duyệt Zalo giữ bản cũ ~10 phút → mở app thì kiểm tra bản mới, có thì tải lại 1 lần (giữ nháp mẫu đang nhập)
(async () => { try {
  const t = await (await fetch(location.pathname + '?chk=' + Date.now(), { cache: 'no-store' })).text();
  const m = t.match(/const BUILD = '(\d{12})'/); if (!m || m[1] <= BUILD) return;
  const k = 'pamt.upd.' + m[1]; if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, '1');
  if (f) saveDraft(); location.replace(location.pathname + '?v=' + m[1]);
} catch (e) {} })();
// nút Back của điện thoại: không thoát khỏi màn 10 shop (chỉ thoát bằng Đăng xuất)
history.pushState({ pa: 1 }, ''); addEventListener('popstate', () => { history.pushState({ pa: 1 }, ''); if (['item', 'list'].includes(st.screen)) { go(st.screen === 'item' ? 'list' : 'shop'); if (st.screen === 'list') renderList(true); } else if (st.screen === 'office') go('name'); else if (st.screen === 'name') go('center'); });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
