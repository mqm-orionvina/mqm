      const it = items[0]; let r;
      try { r = await (await fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ api: 'paSubmit', data: it.data }) })).json(); }

  if (t.dataset.shop) { const n = +t.dataset.shop; if (shopType(n)) { enterShop(n); return; } st.pickShop = n; render(); const tp = $('.pickbox'); if (tp) window.scrollTo(0, tp.getBoundingClientRect().top + scrollY - 70); return; }
  if (t.dataset.ty) { setShopType(t.dataset.ty, st.pickShop); enterShop(st.pickShop); return; }
  if (t.id === 'logout') { if (logoutArm) { logout(); } else { logoutArm = true; t.textContent = 'Bấm lần nữa để đăng xuất'; setTimeout(() => { logoutArm = false; const b = $('#logout'); if (b) b.textContent = 'Đăng xuất'; }, 3500); } return; }
  if (t.dataset.nm) { st.name = t.dataset.nm; render(); return; }
  if (t.id === 'nameOk') { if (st.name.trim().length < 2) { toast('Nhập họ tên trước'); return; } st.name = st.name.trim().replace(/\s+/g, ' '); LS.set('name', st.name); const ns = LS.get('names', []).filter(x => x !== st.name); ns.unshift(st.name); LS.set('names', ns.slice(0, 5)); st.q = ''; go('office'); return; }
  if (t.id === 'toShops' || t.id === 'finish') { st.pickShop = 0; go('shop'); return; }
  if (t.dataset.it) { openItem(t.dataset.it); return; }
  if (t.dataset.sz) { f.size = t.dataset.sz; renderItem(); return; }
  if (t.dataset.re || t.dataset.cam) { openCam(+(t.dataset.re || t.dataset.cam)); return; }
  if (t.id === 'camshot') { snap(); return; }
  if (t.id === 'inappx') { $('#inapp').hidden = true; try { sessionStorage.setItem('pa.inappx', '1'); } catch (e) {} return; }
  if (t.id === 'camx') { $('#camov').hidden = true; return; }
  if (t.dataset.drop) { await DB.del(t.dataset.drop); paintQ(0); return; }
  if (t.id === 'na') { dropDraft(); setDone(f.it.k, 'na'); toast(`${f.it.label}: không có trên kệ`); go('list'); renderList(true); return; }
  if (t.id === 'save') {
    const m = missing(); if (m.length) { toast('Còn thiếu: ' + m.join(', ')); return; }
    const it = f.it, today = TODAY(), id = uid(), flavor = it.other ? 'Khác: ' + f.other.trim() : it.flavor;
    const key = it.other ? `${it.brand}|Khác:${f.other.trim()}|${f.size}` : it.k, sk = shopKey();
    const data = { id, clientAt: new Date().toISOString(), center: st.center, office: `${st.office.code} ${st.office.name}`, brand: it.brand, flavor, size: f.size,
      mfd: f.mfd, mfdOld: f.mfdOld, shop: st.shop, shopType: shopType(), buyDate: today, photo: f.photo, photo2: f.photo2,   /* không gửi thumbnail: Sheet nhẹ, Tracker đọc nhanh (09/11) */ device: DEVICE, sales: st.name, item: it.other ? 'khac' : String(it.no) };
    const label = it.other ? `${it.B.n} ${f.other.trim()} ${f.size === 'Small' ? 'Small (nhỏ)' : 'Normal (vừa)'}` : it.label;
    await DB.put({ id, t: Date.now(), data, label, mark: { sk, key } });
    setDone(key, { a1: ageOf(f.mfd), a2: ageOf(f.mfdOld), st: 'q', id, nm: label });
    toast(`Đã lưu ${label} · tuổi ${ageOf(f.mfd)} / ${ageOf(f.mfdOld)} ngày`);
    f = null; dropDraft(); go('list'); renderList(true); pump();
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'qs') { st.q = e.target.value; paintOffices(); }
  if (e.target.id === 'nm') { st.name = e.target.value; paintNameBar(); }
  if (e.target.id === 'other') { f.other = e.target.value; paintSave(); }
});
document.addEventListener('change', async e => {
  if (e.target.dataset && e.target.dataset.dp && f) { const n = +e.target.dataset.dp; dpOf(n)[e.target.dataset.k] = e.target.value; e.target.classList.toggle('empty', !e.target.value); setDP(n); paintPacks(); saveDraft(); return; }
  if ((e.target.id === 'cam1' || e.target.id === 'cam2') && e.target.files[0]) {
    const file = e.target.files[0], two = e.target.id === 'cam2', y = scrollY;
    try { const lb = e.target.closest('.shot'); if (lb) lb.style.opacity = '.5'; const r = await shrinkAll(file);
      setPhoto(two ? 2 : 1, r); saveDraft(); renderItem(); window.scrollTo(0, y); }
    catch (err) { toast(err.message); }
  }
});

// mở lại app: vào thẳng danh sách shop của Office đã chọn lần trước
if (st.center && st.name && st.office && MASTER.centers.some(c => c.center === st.center)) st.screen = 'shop';
else if (st.center && st.name && MASTER.centers.some(c => c.center === st.center)) st.screen = 'office';
else if (st.center && MASTER.centers.some(c => c.center === st.center)) st.screen = 'name';
if (st.screen === 'shop') { try { const d = JSON.parse(sessionStorage.getItem(DRAFT) || 'null'); if (d && d.shop && shopType(d.shop) && d.sk === shopKey(d.shop)) { st.shop = d.shop; const df = loadDraft(d.it); if (df) { f = df; st.screen = 'item'; } } } catch (e) {} }
// iPhone mở trong Zalo / Facebook: camera trong trang không chạy → nhắc mở bằng Safari (Android vẫn chụp trong app bình thường)
try { if (/iPhone|iPad|iPod/i.test(navigator.userAgent) && !inlineOK && !sessionStorage.getItem('pa.inappx')) $('#inapp').hidden = false; } catch (e) {}
render(); pump();
// nút Back của điện thoại: không thoát khỏi màn 10 shop (chỉ thoát bằng Đăng xuất)
history.pushState({ pa: 1 }, ''); addEventListener('popstate', () => { history.pushState({ pa: 1 }, ''); if (['item', 'list'].includes(st.screen)) { go(st.screen === 'item' ? 'list' : 'shop'); if (st.screen === 'list') renderList(true); } else if (st.screen === 'office') go('name'); else if (st.screen === 'name') go('center'); });
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>
