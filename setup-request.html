<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>MQM · Setup câu hỏi</title>
<style>
:root {
  --red: #c8102e; --red-2: #9e0c24; --red-soft: #fdecee; --ink: #1b1b1f; --muted: #6e6e76; --line: #e7e5e2;
  --page: #f6f4f1; --card: #fff; --green: #2e9b4f; --bad: #d93a2b; --radius: 18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; }
.hero { background: linear-gradient(135deg, var(--red), var(--red-2)); color: #fff; padding: 20px 18px 62px; }
.hero .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 980px; margin: 0 auto; }
.hero .brand { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .22em; font-weight: 700; opacity: .9; }
.hero .brand svg { width: 28px; height: 18px; }
.hero .txt { max-width: 980px; margin: 0 auto; }
.hero h1 { margin: 10px 0 4px; font-size: 25px; font-weight: 800; }
.hero p { margin: 0; opacity: .85; font-size: 13.5px; max-width: 640px; }
.lang { display: inline-flex; background: rgba(255,255,255,.16); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { border: 0; background: none; color: #fff; font: inherit; font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px; cursor: pointer; opacity: .8; }
.lang button.on { background: #fff; color: var(--red); opacity: 1; }
.wrap { max-width: 980px; margin: -44px auto 0; padding: 0 14px 120px; }
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.05); }
.card h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 15px; font-weight: 800; }
.card h2 .n { width: 26px; height: 26px; border-radius: 50%; background: var(--red-soft); color: var(--red); display: grid; place-items: center; font-size: 13px; flex: none; }
.card h2 .meta { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.label { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; display: block; }
.label .req { color: var(--red); }
input, textarea { width: 100%; font: inherit; font-size: 15px; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
textarea { resize: vertical; min-height: 44px; line-height: 1.4; }
input:focus, textarea:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #f1efec; border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 10px 6px; border-radius: 11px; font: inherit; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
.drop { border: 2px dashed #d9d6d1; background: #faf9f7; border-radius: 16px; padding: 26px 18px; text-align: center; cursor: pointer; transition: background .15s, border-color .15s; }
.drop.over { background: var(--red-soft); border-color: var(--red); }
.drop svg { width: 36px; height: 36px; color: var(--red); }
.drop b { display: block; font-size: 16px; margin-top: 6px; } .drop small { color: var(--muted); }
.fileinfo { margin-top: 10px; font-size: 13px; padding: 8px 12px; border-radius: 10px; background: #e7f6ec; color: #1d6b36; }
.fileinfo.err { background: #fdecee; color: var(--bad); }
.paste { margin-top: 10px; } .paste summary { cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 600; }
.paste textarea { margin-top: 8px; min-height: 110px; }
.btn { border: 0; background: var(--red); color: #fff; font: inherit; font-weight: 800; font-size: 15px; padding: 12px 20px; border-radius: 12px; cursor: pointer; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
.btn.sm { font-size: 13px; padding: 8px 14px; border-radius: 10px; }
.qt { width: 100%; border-collapse: separate; border-spacing: 0; }
.qt th { text-align: left; font-size: 12px; font-weight: 700; color: var(--muted); padding: 8px 8px; background: #f6f5f3; }
.qt th:first-child { border-radius: 10px 0 0 10px; } .qt th:last-child { border-radius: 0 10px 10px 0; }
.qt td { padding: 6px 4px; vertical-align: top; border-bottom: 1px solid var(--line); }
.qt td.no { width: 36px; text-align: center; font-weight: 700; color: var(--muted); padding-top: 16px; font-size: 13px; }
.qt td.x { width: 36px; text-align: center; }
.qt td.x button { border: 0; background: none; font-size: 18px; color: #b5b2ad; cursor: pointer; padding: 10px 6px; }
.qt td.x button:hover { color: var(--bad); }
.qt textarea { border-radius: 10px; font-size: 14px; padding: 9px 11px; }
.qt td.chg textarea { background: #fffaf0; overflow: hidden; resize: none; min-height: 44px; }
.qt td.q { padding: 10px 10px 10px 4px; }
.qt td.chg { width: 40%; }
.qtx { font-size: 15px; line-height: 1.45; font-weight: 600; }
.grp { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--red-soft); color: var(--red); margin-bottom: 4px; }
.qt td.chg textarea:not(:placeholder-shown) { border-color: #e8a400; background: #fff6dc; }
.empty { text-align: center; color: var(--muted); padding: 22px 0; font-size: 14px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.95); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); }
.bar .in { max-width: 980px; margin: 0 auto; display: flex; gap: 10px; align-items: center; } .bar .msg { flex: 1; font-size: 12.5px; color: var(--muted); }
.done { position: fixed; inset: 0; background: rgba(20,20,24,.55); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.done.on { display: flex; }
.done .sheet { background: #fff; width: 100%; max-width: 440px; border-radius: 22px; padding: 26px 22px; text-align: center; }
.done .ok { width: 56px; height: 56px; border-radius: 50%; background: #e7f6ec; color: var(--green); display: grid; place-items: center; margin: 0 auto 10px; }
.done h3 { margin: 0 0 6px; font-size: 19px; } .done p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
.toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 90vw; }
.toast.on { opacity: 1; }
.hint { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
/* Bước 2: chọn mẫu theo brand → vị → quy cách */
.bseg { max-width: 360px; margin-bottom: 4px; }
table.st { width: 100%; border-collapse: collapse; margin-top: 10px; }
table.st th { text-align: left; font-size: 12px; color: var(--muted); padding: 6px 8px; background: #f6f5f3; }
table.st td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.st td.fl { font-weight: 600; font-size: 14px; width: 34%; }
table.st td.all { width: 70px; text-align: right; }
.sz { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; margin: 2px 4px 2px 0; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
.sz.on { background: var(--red); border-color: var(--red); color: #fff; }
.sz.all { border-style: dashed; color: var(--muted); } .sz.all.on { color: #fff; border-style: solid; }
/* Kết quả chung RD + MKT */
.card.res { border: 2px solid var(--red); }
.tchips { display: flex; gap: 8px; flex-wrap: wrap; }
.tchip { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: #f1efec; color: var(--muted); }
.tchip.ok { background: #e7f6ec; color: #1d6b36; }
.rstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 14px 0 6px; }
.rstats > div { background: #f6f5f3; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.rstats small { font-size: 12px; color: var(--muted); } .rstats b { font-size: 26px; } .rstats b.d { font-size: 17px; } .rstats .warn { color: var(--bad); font-weight: 700; }
.res details { margin-top: 10px; } .res summary { cursor: pointer; font-weight: 700; font-size: 14px; }
.rlist { margin: 8px 0 0; padding-left: 22px; font-size: 14px; line-height: 1.5; } .rlist li + li { margin-top: 4px; }
.tg { font-size: 11px; font-weight: 700; color: var(--muted); }
.rtbl { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13.5px; } .rtbl td { padding: 7px 6px; border-bottom: 1px solid var(--line); }
.stt { font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.stt.ok { background: #2e9b4f; color: #fff; } .stt.low { background: #f2b705; color: #111; } .stt.none { background: #d93a2b; color: #fff; }
@media (max-width: 640px) { .rstats { grid-template-columns: 1fr; } table.st td.fl { width: auto; } }
@media (max-width: 640px) {
  .row2 { grid-template-columns: 1fr; }
  .qt thead { display: none; }
  .qt tr { display: grid; grid-template-columns: 30px 1fr 30px; grid-template-areas: "no q x" "no c x"; border-bottom: 1px solid var(--line); padding: 6px 0; }
  .qt td { border: 0; padding: 3px 2px; } .qt td.no { grid-area: no; padding-top: 12px; } .qt td.q { grid-area: q; } .qt td.chg { grid-area: c; } .qt td.x { grid-area: x; }
}
</style>
</head>
<body>
<header class="hero" id="hero"></header>
<main class="wrap" id="app"></main>
<div class="bar"><div class="in"><span class="msg" id="barMsg"></span><button class="btn ghost sm" id="xlsx"></button><button class="btn" id="send"></button></div></div>
<div class="done" id="done"><div class="sheet">
  <div class="ok"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
  <h3 id="doneHead"></h3><p id="doneTxt"></p><button class="btn" id="doneOk"></button>
</div></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".docx,.xlsx,.xls,.csv,.txt" hidden>
<script>
// MQM PC · Bước 1 Setup: RD / MKT thả file mong muốn (Word / Excel) → app chuyển ngay thành bảng câu hỏi,
// cạnh mỗi câu hỏi có cột "Mong muốn thay đổi" → Gửi: lưu tab Requests trong Google Sheet MQM + email về anh Thái (chủ Apps Script).
// File chỉ đọc trên trình duyệt; chỉ bảng câu hỏi được gửi đi. Gọi API không kèm tài khoản Google.

const KEY = '2vz3ylmgwosijd';
const LIB = { xlsx: 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js', mammoth: 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js' };
const TEAMS = ['RD', 'MKT'];

    who: 'Bạn là ai', name: 'Tên', namePh: 'VD: Nguyễn Văn A', team: 'Team',

    paste: 'Hoặc dán văn bản (mỗi dòng 1 câu hỏi)', pasteBtn: 'Chuyển thành câu hỏi', reading: 'Đang đọc file…',
    readOk: (n, f) => `Đã chuyển ${n} câu hỏi từ ${f}.`, readErr: 'Không đọc được file: ', noQ: 'Không tìm thấy câu hỏi nào trong file.',

    send: 'Gửi', sending: 'Đang gửi…', xlsx: 'Tải Excel', need: 'Còn thiếu: ', m_name: 'tên', m_team: 'team', m_rows: 'câu hỏi', m_smp: 'mẫu cần mua', m_date: 'ngày sản xuất', ready: 'Sẵn sàng gửi',
    doneH: 'Đã gửi', doneT: (q, s) => `${q} câu hỏi và ${s} mẫu đã gửi về email anh Thái. Xem "Kết quả chung" ở đầu trang.`, ok: 'Xong', sendErr: 'Chưa gửi được: ', sendErr2: 'Có thể bấm "Tải Excel" rồi gửi file cho anh Thái.',
    resH: 'Kết quả chung · RD + MKT', resSent: (t, n) => `${t} đã gửi (${n})`, resWait: t => `${t} chưa gửi`, resQ: 'Câu hỏi final', resS: 'Mẫu final', resD: 'Ngày sản xuất final',

  },
  ko: {

    q: '질문', chg: '변경 요청', chgPh: '그대로면 비워 두세요', clear: '모두 삭제', clearAsk: '질문표 전체를 삭제할까요?',
    empty: '질문이 없습니다. 위에 요구 파일을 놓으세요.',

    doneH: '전송 완료', doneT: (q, s) => `질문 ${q}개 · 샘플 ${s}개가 Thái 님 메일로 전송되었습니다. 상단 "공통 결과"를 확인하세요.`, ok: '확인', sendErr: '전송 실패: ', sendErr2: '"Excel 다운로드" 후 파일을 Thái 님께 보내 주세요.',

// Brand đưa vào bước 2 (đợt này chỉ O'star và Swing); tên hiển thị
const PLAN_BRANDS = [['OStar', "O'star"], ['Swing', 'Swing']];let lang = (() => { try { return localStorage.getItem('mqm1a-lang') === 'ko' ? 'ko' : 'vi'; } catch (e) { return 'vi'; } })();
const T = k => I18N[lang][k];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let toastT;
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3200); };

// Bản nháp giữ trên máy (tắt trang không mất): tên, team, tên file, bảng câu hỏi
const DRAFT = 'mqm-setup-draft';
let st = (() => { try { return JSON.parse(localStorage.getItem(DRAFT)) || null; } catch (e) { return null; } })() || { name: '', team: '', file: '', rows: [], info: '', err: false };
st.samples = st.samples || []; st.brand = st.brand || PLAN_BRANDS[0][0]; st.dateFrom = st.dateFrom || ''; st.dateTo = st.dateTo || '';
// products: danh mục từ Sheet (tab Products); plan: kết quả chung RD + MKT (api=plan)
let products = null, catErr = '', plan = null;
const save = () => { try { localStorage.setItem(DRAFT, JSON.stringify(st)); } catch (e) {} };
let sending = false;

const loadLib = (k, glob) => window[glob] ? Promise.resolve() : new Promise((res, rej) => { const s = document.createElement('script'); s.src = LIB[k]; s.onload = res; s.onerror = () => rej(new Error(k)); document.head.appendChild(s); });
// Bỏ ký hiệu đầu dòng / đánh số: "- ", "• ", "1. ", "1) ", "a) ", "(2) "
const clean = s => String(s ?? '').replace(/\s+/g, ' ').trim().replace(/^([-*•●▪◦–]|\(?\d{1,3}[.)]|\(?[a-zA-Z][.)])\s+/, '').trim();

// ---------- Chuyển văn bản mong muốn (Word dài, văn xuôi) thành bộ câu hỏi ngắn để tích Ổn / Có vấn đề ----------
// 1) Tìm các dòng "Tiêu chí: mô tả…" (Bao bì, Ngoại quan, Cấu trúc / Kết cấu, Hương vị…); mỗi ý trong mô tả thành 1 câu hỏi
// 2) Viết lại ngắn, theo hướng "đạt" để chọn Ổn = đạt: "gói có đủ khí không" → "Gói đủ khí?"; "có bị nhăn" → "không bị nhăn"
// 3) Không có dòng tiêu chí: lấy các câu hỏi có sẵn trong văn bản (kết thúc bằng "?" hoặc "… không")
const CRIT = [['Bao bì', /^(bao bì|đóng gói|package|packaging)$/i], ['Ngoại quan', /^(ngoại quan|hình thức|appearance)$/i],
  ['Cấu trúc', /^(cấu trúc|kết cấu|texture)$/i], ['Hương vị', /^(hương vị|mùi vị|flavou?r|taste)$/i], ['Màu sắc', /^màu sắc$/i], ['Mùi', /^mùi$/i]];
const critOf = label => { const l = label.replace(/\s*\([^)]*\)\s*/g, '').trim(); const c = CRIT.find(([, re]) => re.test(l)); return c ? c[0] : ''; };
// Tách theo dấu phẩy / chấm phẩy, không tách trong ngoặc "(Original, Kimchi…)"
function splitClauses(s) {
  const out = []; let depth = 0, buf = '';
  for (const ch of s) {
    if (ch === '(') depth++; if (ch === ')') depth = Math.max(0, depth - 1);
    if ((ch === ',' || ch === ';') && depth === 0) { out.push(buf); buf = ''; } else buf += ch;
  }
  out.push(buf);
  return out.map(x => x.trim().replace(/[.]+$/, '').trim()).filter(Boolean);
}
const nWords = s => s.split(/\s+/).filter(Boolean).length;
const QEND = /\s+(không|chưa|ko)\s*\??$|\?$/i;
// Ý ngắn chưa hết câu ("miếng khoai có giòn", "có bị đặc") nối với ý sau tới khi gặp "… không"
function descToQs(desc) {
  const parts = splitClauses(desc), qs = [];
  for (let i = 0; i < parts.length; i++) {
    let p = parts[i];
    while (!QEND.test(p) && nWords(p) <= 5 && i + 1 < parts.length) p += ', ' + parts[++i];
    qs.push(p);
  }
  // Chỉ 2 ý: ý đạt + ý "có bị …" của cùng thuộc tính (giòn, xốp / đặc, cứng, mềm) → 1 câu
  if (qs.length === 2 && /^có bị(?=\s|$)/i.test(qs[1])) return [qs[0].replace(QEND, '') + ', ' + qs[1]];
  return qs;
}
// (Chữ tiếng Việt có dấu không khớp \b của JS nên dùng (?=\s|,|$) để chặn cuối từ)
function toCheck(s) {
  let t = s.replace(QEND, '').trim();
  t = t.replace(/(^|\s)có\s+(bị|còn|lẫn)(?=\s|,|$)/gi, '$1không $2').replace(/(^|\s)có\s+(?!thể(\s|$))/gi, '$1').replace(/^\s+/, '');
  t = t.replace(/\s+/g, ' ').trim();
  return t ? t[0].toUpperCase() + t.slice(1) + '?' : '';
}
function textToRows(items) {
  items = items.map(s => String(s ?? '').replace(/\s+/g, ' ').trim()).filter(Boolean);
  const rows = [];
  items.forEach(s => {
    const m = clean(s).match(/^([^:]{2,40}):\s*(.+)$/);
    const g = m && critOf(m[1]);
    if (g) descToQs(m[2]).map(toCheck).filter(Boolean).forEach(q => rows.push({ g, q, c: '' }));
  });
  if (rows.length) return rows;
  // Không có dòng tiêu chí: câu hỏi có sẵn trong văn bản
  items.forEach(s => (s.match(/[^.?!]*\?/g) || []).map(x => x.trim()).filter(x => nWords(x) >= 3 && nWords(x) <= 30)
    .forEach(x => rows.push({ g: '', q: toCheck(clean(x)), c: '' })));
  return rows;
}
const linesToRows = txt => textToRows(String(txt).split(/\r?\n/));

// Excel: tìm dòng tiêu đề có cột câu hỏi (và cột mong muốn nếu có); không có thì lấy cột nhiều chữ nhất
const Q_RE = /câu hỏi|question|nội dung|tiêu chí|hạng mục|item|mục đánh giá|질문|항목/i, C_RE = /thay đổi|mong muốn|change|ghi chú|note|요청|변경/i;
function sheetRows(rows) {
  rows = rows.map(r => (r || []).map(v => String(v ?? '').trim()));
  let h = rows.findIndex(r => r.some(v => Q_RE.test(v)));
  let qc, cc = -1;
  if (h >= 0 && h < 10) { qc = rows[h].findIndex(v => Q_RE.test(v)); cc = rows[h].findIndex((v, i) => i !== qc && C_RE.test(v)); }
  else {
    h = -1; const w = {};
    rows.forEach(r => r.forEach((v, i) => { if (v && isNaN(+v)) w[i] = (w[i] || 0) + v.length; }));
    qc = +Object.keys(w).sort((a, b) => w[b] - w[a])[0];
  }
  return rows.slice(h + 1).map(r => ({ g: '', q: clean(r[qc]), c: cc >= 0 ? String(r[cc] || '').trim() : '' })).filter(r => r.q.length >= 3);
}
async function readFile(f) {
  st.info = T('reading'); st.err = false; render();
  try {
    const ext = f.name.split('.').pop().toLowerCase(); let rows = [];
    if (ext === 'docx') {
      await loadLib('mammoth', 'mammoth');
      // Đọc theo đoạn / gạch đầu dòng (giữ nguyên dòng "Bao bì: …" của danh sách)
      const r = await mammoth.convertToHtml({ arrayBuffer: await f.arrayBuffer() });
      const doc = new DOMParser().parseFromString(r.value, 'text/html');
      rows = textToRows([...doc.querySelectorAll('li, p, td, h1, h2, h3, h4')].filter(e => !e.querySelector('li, p')).map(e => e.textContent));
    } else if (['xlsx', 'xls', 'csv'].includes(ext)) {
      await loadLib('xlsx', 'XLSX');
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      wb.SheetNames.forEach(n => { rows = rows.concat(sheetRows(XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, blankrows: false }))); });
    } else if (ext === 'txt') rows = linesToRows(await f.text());
    else throw new Error('.' + ext);
    if (!rows.length) { st.info = T('noQ'); st.err = true; render(); return; }
    st.rows = rows; st.file = f.name; st.info = T('readOk')(rows.length, f.name); st.err = false;
  } catch (e) { st.info = T('readErr') + (e.message || e); st.err = true; }
  save(); render();
}

function hero() {
  document.documentElement.lang = lang; document.title = 'MQM · ' + T('title');
  $('#hero').innerHTML = `<div class="top"><div class="brand"><svg viewBox="0 0 46 30" fill="#fff"><ellipse cx="13" cy="15" rx="12" ry="13"/><ellipse cx="33" cy="15" rx="12" ry="13"/><circle cx="16" cy="12" r="4" fill="#c8102e"/><circle cx="36" cy="12" r="4" fill="#c8102e"/></svg>${T('step')}</div>
    <div class="lang"><button data-lang="vi" class="${lang === 'vi' ? 'on' : ''}">VI</button><button data-lang="ko" class="${lang === 'ko' ? 'on' : ''}">한국어</button></div></div>
    <div class="txt"><h1>${T('title')}</h1><p>${T('sub')}</p></div>`;
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { lang = b.dataset.lang; try { localStorage.setItem('mqm1a-lang', lang); } catch (e) {} render(); });
}
const dmy = d => d ? d.split('-').reverse().join('/') : '';
// Kết quả chung (sau khi RD và / hoặc MKT gửi): câu hỏi final · mẫu final + tình trạng đủ / thiếu gói · ngày sản xuất final
function resultCard() {
  if (!plan) return '';
  const F = plan.final, tm = t => plan.teams[t] ? `<span class="tchip ok">✓ ${T('resSent')(t, esc(plan.teams[t].name))}</span>` : `<span class="tchip">${T('resWait')(t)}</span>`;
  const okN = F.samples.filter(x => x.have >= x.need).length;
  const st3 = x => x.have >= x.need ? ['ok', T('stOk')] : x.have > 0 ? ['low', T('stLow')] : ['none', T('stNone')];
  return `<section class="card res"><h2>${T('resH')}</h2><div class="tchips">${tm('RD')}${tm('MKT')}</div>
    <div class="rstats"><div><small>${T('resQ')}</small><b>${F.questions.length}</b></div><div><small>${T('resS')}</small><b>${F.samples.length}</b><small>${okN}/${F.samples.length} ${T('stOk').toLowerCase()}</small></div>
      <div><small>${T('resD')}</small><b class="d">${F.dateFrom ? dmy(F.dateFrom) + ' – ' + dmy(F.dateTo) : '—'}</b>${F.dateConflict ? `<small class="warn">${T('resConflict')}</small>` : ''}</div></div>
    ${F.questions.length ? `<details><summary>${T('resQs')(F.questions.length)}</summary><ol class="rlist">${F.questions.map(q => `<li>${esc(q.q)} <span class="tg">${esc(q.team)}</span></li>`).join('')}</ol></details>` : ''}
    ${F.samples.length ? `<details><summary>${T('resSs')(F.samples.length)}</summary><table class="rtbl">${F.samples.map(x => { const [c, l] = st3(x); return `<tr><td>${esc(x.brand)} · ${esc(x.flavor)}</td><td>${esc(x.sku)}</td><td class="tg">${esc(x.teams)}</td><td>${T('have')(x.have, x.need)}</td><td><span class="stt ${c}">${l}</span></td></tr>`; }).join('')}</table></details>` : ''}
    <p class="hint">${T('resNote')}</p></section>`;
}
// Bước 2: danh mục O'star / Swing theo vị, mỗi vị bấm chọn quy cách (size)
const skusOf = p => String(p.sku || '').split(',').map(x => x.trim()).filter(Boolean);
const sKey = (b, f, s) => `${b}|${f}|${s}`;
function sampleCard() {
  if (!products) return `<div class="empty">${catErr ? esc(T('catErr') + catErr) : T('loadingCat')}</div>`;
  const list = products.filter(p => p.brand === st.brand);
  return `<div class="seg bseg" id="bseg">${PLAN_BRANDS.map(([b, l]) => { const n = st.samples.filter(k => k.startsWith(b + '|')).length; return `<button class="${st.brand === b ? 'on' : ''}" data-b="${b}">${esc(l)}${n ? ` · ${n}` : ''}</button>`; }).join('')}</div>
    <p class="hint">${T('smpHint')}</p>
    <table class="st"><thead><tr><th>${T('flavor')}</th><th>${T('size')}</th><th></th></tr></thead><tbody>
    ${list.map(p => { const ks = skusOf(p).map(s => sKey(p.brand, p.flavor, s)), all = ks.length && ks.every(k => st.samples.includes(k));
      return `<tr><td class="fl">${esc(p.flavor)}</td><td>${skusOf(p).map(s => { const k = sKey(p.brand, p.flavor, s); return `<button class="sz ${st.samples.includes(k) ? 'on' : ''}" data-k="${esc(k)}">${esc(s)}</button>`; }).join('')}</td>
        <td class="all"><button class="sz all ${all ? 'on' : ''}" data-all="${esc(ks.join(';'))}">${T('allFlavor')}</button></td></tr>`; }).join('')}</tbody></table>`;
}
function render() {
  hero();
  const nC = st.rows.filter(r => r.c.trim()).length;
  $('#app').innerHTML = resultCard() + `
    <section class="card"><h2>${T('who')}</h2>
      <div class="row2"><div><span class="label">${T('name')} <span class="req">*</span></span><input id="nm" autocomplete="name" placeholder="${esc(T('namePh'))}" value="${esc(st.name)}"></div>
        <div><span class="label">${T('team')} <span class="req">*</span></span><div class="seg" id="tm">${TEAMS.map(t => `<button class="${st.team === t ? 'on' : ''}" data-v="${t}">${t}</button>`).join('')}</div></div></div></section>
    <section class="card"><h2><span class="n">1</span>${T('s1')}<span class="meta" id="qmeta">${st.rows.length ? T('count')(st.rows.length, nC) : ''}</span></h2>
      <div class="drop" id="drop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
        <b>${T('drop')}</b><small>${T('dropSub')}</small></div>
      ${st.info ? `<div class="fileinfo ${st.err ? 'err' : ''}">${esc(st.info)}</div>` : ''}
      <details class="paste"><summary>${T('paste')}</summary><textarea id="pasteTx"></textarea><div class="tools"><button class="btn ghost sm" id="pasteGo">${T('pasteBtn')}</button></div></details>
      ${st.rows.length ? `<table class="qt" style="margin-top:12px"><thead><tr><th>#</th><th>${T('q')}</th><th>${T('chg')}</th></tr></thead><tbody>
        ${st.rows.map((r, i) => `<tr><td class="no">${i + 1}</td><td class="q">${r.g ? `<span class="grp">${esc(r.g)}</span>` : ''}<div class="qtx">${esc(r.q)}</div></td>
          <td class="chg"><textarea rows="1" data-i="${i}" data-k="c" placeholder="${esc(T('chgPh'))}">${esc(r.c)}</textarea></td></tr>`).join('')}</tbody></table>
        <div class="tools"><button class="btn ghost sm" id="clr">${T('clear')}</button></div>` : `<div class="empty">${T('empty')}</div>`}</section>
    <section class="card"><h2><span class="n">2</span>${T('s2')}<span class="meta">${T('picked')(st.samples.length)}</span></h2>${sampleCard()}</section>
    <section class="card"><h2><span class="n">3</span>${T('s3')}</h2>
      <div class="row2"><div><span class="label">${T('dateFrom')} <span class="req">*</span></span><input type="date" id="df" value="${esc(st.dateFrom)}"></div>
        <div><span class="label">${T('dateTo')} <span class="req">*</span></span><input type="date" id="dt" value="${esc(st.dateTo)}" min="${esc(st.dateFrom)}"></div></div>
      <p class="hint">${T('dateHint')}</p></section>`;
  bind(); status();
}
function missing() {
  const m = []; if (!st.name.trim()) m.push(T('m_name')); if (!st.team) m.push(T('m_team')); if (!st.rows.some(r => r.q.trim())) m.push(T('m_rows'));
  if (!st.samples.length) m.push(T('m_smp')); if (!st.dateFrom || !st.dateTo || st.dateFrom > st.dateTo) m.push(T('m_date'));
  return m;
}
function status() {
  const m = missing(); $('#send').disabled = !!m.length || sending; $('#send').textContent = sending ? T('sending') : T('send');
  $('#xlsx').textContent = T('xlsx'); $('#xlsx').disabled = !st.rows.length;
  $('#barMsg').textContent = m.length ? T('need') + m.join(', ') : T('ready');
  const meta = $('#qmeta'); if (meta && st.rows.length) meta.textContent = T('count')(st.rows.length, st.rows.filter(r => r.c.trim()).length);
}function bind() {
  $('#nm').oninput = e => { st.name = e.target.value; save(); status(); };
  document.querySelectorAll('#tm button').forEach(b => b.onclick = () => { st.team = b.dataset.v; save(); render(); });
  const drop = $('#drop');
  drop.onclick = () => $('#file').click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); const f = e.dataTransfer.files[0]; if (f) readFile(f); };
  $('#pasteGo').onclick = () => { const rows = linesToRows($('#pasteTx').value); if (!rows.length) return toast(T('noQ')); st.rows = st.rows.concat(rows); st.info = T('readOk')(rows.length, 'text'); st.err = false; save(); render(); };
  // Ô "Mong muốn thay đổi" tự giãn theo nội dung (không thanh cuộn)
  const grow = el => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 2 + 'px'; };
  document.querySelectorAll('.qt textarea').forEach(el => { grow(el); el.oninput = () => { st.rows[+el.dataset.i][el.dataset.k] = el.value; grow(el); save(); status(); }; });
  const clr = $('#clr'); if (clr) clr.onclick = () => { if (confirm(T('clearAsk'))) { st.rows = []; st.file = ''; st.info = ''; save(); render(); } };
  const keep = () => { const y = scrollY; save(); render(); scrollTo(0, y); };
  document.querySelectorAll('#bseg button').forEach(b => b.onclick = () => { st.brand = b.dataset.b; keep(); });
  document.querySelectorAll('.sz[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k, i = st.samples.indexOf(k); i >= 0 ? st.samples.splice(i, 1) : st.samples.push(k); keep(); });
  document.querySelectorAll('.sz[data-all]').forEach(b => b.onclick = () => { const ks = b.dataset.all.split(';').filter(Boolean), all = ks.every(k => st.samples.includes(k));
    st.samples = all ? st.samples.filter(k => !ks.includes(k)) : [...new Set(st.samples.concat(ks))]; keep(); });
  $('#df').onchange = e => { st.dateFrom = e.target.value; if (st.dateTo && st.dateTo < st.dateFrom) st.dateTo = ''; keep(); };
  $('#dt').onchange = e => { st.dateTo = e.target.value; keep(); };
}
$('#file').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) readFile(f); };
$('#xlsx').onclick = async () => {
  await loadLib('xlsx', 'XLSX');
  const ws = XLSX.utils.aoa_to_sheet([['#', 'Nhóm', I18N.vi.q, I18N.vi.chg], ...st.rows.map((r, i) => [i + 1, r.g || '', r.q, r.c])]);
  ws['!cols'] = [{ wch: 5 }, { wch: 12 }, { wch: 60 }, { wch: 45 }];
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Cau hoi');
  XLSX.writeFile(wb, `MQM-setup-${st.team || 'team'}-${new Date().toISOString().slice(0, 10)}.xlsx`);
};
$('#send').onclick = async () => {
  if (missing().length || sending) return;
  sending = true; status();
  try {
    const rows = st.rows.map(r => ({ q: (r.g ? r.g + ' · ' : '') + r.q.trim(), c: r.c.trim() })).filter(r => r.q);
    const r = await fetch(API, { method: 'POST', credentials: 'omit', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ api: 'sendRequest', k: KEY, data: { name: st.name.trim(), team: st.team, file: st.file, rows,
        samples: st.samples.map(k => { const [brand, flavor, sku] = k.split('|'); return { brand, flavor, sku }; }), dateFrom: st.dateFrom, dateTo: st.dateTo } }) }).then(x => x.json());
    if (!r.ok) throw new Error(r.error || '?');
    $('#doneHead').textContent = T('doneH'); $('#doneTxt').textContent = T('doneT')(r.count, r.samples); $('#doneOk').textContent = T('ok');
    $('#done').classList.add('on');
    st.rows = []; st.file = ''; st.info = ''; st.samples = []; save(); loadPlan();
  } catch (e) { toast(T('sendErr') + (e.message || e) + '. ' + T('sendErr2')); }
  sending = false; render();
};
$('#doneOk').onclick = () => { $('#done').classList.remove('on'); scrollTo(0, 0); };
const apiGet = q => fetch(`${API}?api=${q}&k=${KEY}`, { credentials: 'omit' }).then(r => r.json());
function loadPlan() { apiGet('plan').then(r => { if (r.ok) { plan = r; render(); } }).catch(() => {}); }
render();
apiGet('catalog').then(r => { if (!r.ok) throw new Error(r.error); products = r.products.filter(p => PLAN_BRANDS.some(([b]) => b === p.brand)); render(); })
  .catch(e => { catErr = e.message || String(e); render(); });
loadPlan();
</script>
