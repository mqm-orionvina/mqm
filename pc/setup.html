<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>MQM ORION VINA · Setup</title>
<style>
:root {
  --red: #c8102e; --red-2: #9e0c24; --red-soft: #fdecee; --ink: #1b1b1f; --muted: #6e6e76; --line: #e7e5e2;
  --page: #f6f4f1; --card: #fff; --green: #2e9b4f; --bad: #d93a2b; --radius: 18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; }
.hero { background: linear-gradient(135deg, var(--red), var(--red-2)); color: #fff; padding: 20px 18px 62px; }
.hero .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 980px; margin: 0 auto; }
.hero .brand { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .22em; font-weight: 700; opacity: .9; }
.hero .brand svg { width: 28px; height: 18px; }
.hero .txt { max-width: 980px; margin: 0 auto; }
.hero h1 { margin: 10px 0 4px; font-size: 25px; font-weight: 800; }
.hero p { margin: 0; opacity: .85; font-size: 13.5px; max-width: 640px; }
.lang { display: inline-flex; background: rgba(255,255,255,.16); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { border: 0; background: none; color: #fff; font: inherit; font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px; cursor: pointer; opacity: .8; }
.lang button.on { background: #fff; color: var(--red); opacity: 1; }
.wrap { max-width: 980px; margin: -44px auto 0; padding: 0 14px 120px; }
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.05); }
.card h2 { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; font-size: 15px; font-weight: 800; }
.card h2 .n { width: 26px; height: 26px; border-radius: 50%; background: var(--red-soft); color: var(--red); display: grid; place-items: center; font-size: 13px; flex: none; }
.card h2 .meta { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.label { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; display: block; }
.label .req { color: var(--red); }
input, textarea { width: 100%; font: inherit; font-size: 15px; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
textarea { resize: vertical; min-height: 44px; line-height: 1.4; }
input:focus, textarea:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 3px var(--red-soft); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #f1efec; border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 10px 6px; border-radius: 11px; font: inherit; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
.drop { border: 2px dashed #d9d6d1; background: #faf9f7; border-radius: 16px; padding: 26px 18px; text-align: center; cursor: pointer; transition: background .15s, border-color .15s; }
.drop.over { background: var(--red-soft); border-color: var(--red); }
.drop svg { width: 36px; height: 36px; color: var(--red); }
.drop b { display: block; font-size: 16px; margin-top: 6px; } .drop small { color: var(--muted); }
.fileinfo { margin-top: 10px; font-size: 13px; padding: 8px 12px; border-radius: 10px; background: #e7f6ec; color: #1d6b36; }
.fileinfo.err { background: #fdecee; color: var(--bad); }
.paste { margin-top: 10px; } .paste summary { cursor: pointer; font-size: 13px; color: var(--muted); font-weight: 600; }
.paste textarea { margin-top: 8px; min-height: 110px; }
.btn { border: 0; background: var(--red); color: #fff; font: inherit; font-weight: 800; font-size: 15px; padding: 12px 20px; border-radius: 12px; cursor: pointer; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
.btn.sm { font-size: 13px; padding: 8px 14px; border-radius: 10px; }
.qt { width: 100%; border-collapse: separate; border-spacing: 0; }
.qt th { text-align: left; font-size: 12px; font-weight: 700; color: var(--muted); padding: 8px 8px; background: #f6f5f3; }
.qt th:first-child { border-radius: 10px 0 0 10px; } .qt th:last-child { border-radius: 0 10px 10px 0; }
.qt td { padding: 6px 4px; vertical-align: top; border-bottom: 1px solid var(--line); }
.qt td.no { width: 36px; text-align: center; font-weight: 700; color: var(--muted); padding-top: 16px; font-size: 13px; }
.qt td.x { width: 36px; text-align: center; }
.qt td.x button { border: 0; background: none; font-size: 18px; color: #b5b2ad; cursor: pointer; padding: 10px 6px; }
.qt td.x button:hover { color: var(--bad); }
.qt textarea { border-radius: 10px; font-size: 14px; padding: 9px 11px; }
.qt td.chg textarea { background: #fffaf0; overflow: hidden; resize: none; min-height: 44px; }
.qt td.q { padding: 10px 10px 10px 4px; }
.qt td.chg { width: 40%; }
.qtx { font-size: 15px; line-height: 1.45; font-weight: 600; }
.qt textarea.qedit { font-size: 15px; font-weight: 600; line-height: 1.45; overflow: hidden; resize: none; min-height: 44px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.reuse-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; } .reuse-row small { color: var(--muted); }
.srcbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; background: #f3f3f3; border-radius: 16px; padding: 12px 14px; font-weight: 600; font-size: 14px; }
.grp { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--red-soft); color: var(--red); margin-bottom: 4px; }
.qt td.chg textarea:not(:placeholder-shown) { border-color: #e8a400; background: #fff6dc; }
.empty { text-align: center; color: var(--muted); padding: 22px 0; font-size: 14px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.95); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); }
.bar .in { max-width: 980px; margin: 0 auto; display: flex; gap: 10px; align-items: center; } .bar .msg { flex: 1; font-size: 12.5px; color: var(--muted); }
.done { position: fixed; inset: 0; background: rgba(20,20,24,.55); display: none; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.done.on { display: flex; }
.done .sheet { background: #fff; width: 100%; max-width: 440px; border-radius: 22px; padding: 26px 22px; text-align: center; }
.done .ok { width: 56px; height: 56px; border-radius: 50%; background: #e7f6ec; color: var(--green); display: grid; place-items: center; margin: 0 auto 10px; }
.done h3 { margin: 0 0 6px; font-size: 19px; } .done p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
.toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 90vw; }
.toast.on { opacity: 1; }
.done .sheet.rv { max-width: 760px; max-height: 88vh; overflow: auto; text-align: left; }
.rvbtn { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; position: sticky; bottom: -26px; background: #fff; padding: 12px 0 4px; }
.rvsec { margin-top: 14px; } .rvsec h4 { margin: 0 0 6px; font-size: 14px; }
.savedbox { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #e7f6ec; color: #1d6b36; font-size: 13.5px; font-weight: 600; }
.savedbox.draft { background: #fff6dc; color: #8a6200; }
.who b { font-size: 16px; }
.hint { font-size: 12.5px; color: var(--muted); margin: 8px 0 0; }
/* Bước 2: chọn mẫu theo brand → vị → quy cách */
.bseg { max-width: 360px; margin-bottom: 4px; }
table.st { width: 100%; border-collapse: collapse; margin-top: 10px; }
table.st th { text-align: left; font-size: 12px; color: var(--muted); padding: 6px 8px; background: #f6f5f3; }
table.st td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
table.st td.fl { font-weight: 600; font-size: 14px; width: 34%; }
table.st td.all { width: 70px; text-align: right; }
.sz { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; margin: 2px 4px 2px 0; font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); cursor: pointer; }
.sz.on { background: var(--red); border-color: var(--red); color: #fff; }
.sz.all { border-style: dashed; color: var(--muted); } .sz.all.on { color: #fff; border-style: solid; }
/* Danh sách mẫu (10/11): mỗi brand 1 bảng 2 cột Vị | Size + số lượng */
.plan2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
.pbrand h3 { margin: 0 0 4px; font-size: 16px; font-weight: 800; }
.pbrand table.st td.fl { width: 42%; }
.szq { display: inline-flex; align-items: center; gap: 0; margin: 2px 6px 2px 0; }
.szq .sz { margin: 0; } .szq.on .sz { border-radius: 999px 0 0 999px; }
.szq input { width: 62px !important; min-height: 0 !important; height: 33px; padding: 0 6px !important; text-align: center; font-weight: 800; font-size: 14px; border-radius: 0 999px 999px 0 !important; border: 1.5px solid #111 !important; border-left: 0 !important; }
.addfl { display: flex; gap: 8px; align-items: center; margin-top: 8px; } .addfl select { flex: 1; min-height: 40px !important; font: inherit; font-size: 14px; padding: 6px 10px; border-radius: 12px; }
@media (max-width: 860px) { .plan2 { grid-template-columns: 1fr; } }
/* Kết quả chung RD + MKT */
.card.res { border: 2px solid var(--red); }
.tchips { display: flex; gap: 8px; flex-wrap: wrap; }
.tchip { font-size: 12.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: #f1efec; color: var(--muted); }
.tchip.ok { background: #e7f6ec; color: #1d6b36; }
.rstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin: 14px 0 6px; }
.rstats > div { background: #f6f5f3; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.rstats small { font-size: 12px; color: var(--muted); } .rstats b { font-size: 26px; } .rstats b.d { font-size: 17px; } .rstats .warn { color: var(--bad); font-weight: 700; }
.res details { margin-top: 10px; } .res summary { cursor: pointer; font-weight: 700; font-size: 14px; }
.rlist { margin: 8px 0 0; padding-left: 22px; font-size: 14px; line-height: 1.5; } .rlist li + li { margin-top: 4px; }
.tg { font-size: 11px; font-weight: 700; color: var(--muted); }
.rtbl { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13.5px; } .rtbl td { padding: 7px 6px; border-bottom: 1px solid var(--line); }
.stt { font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
.stt.ok { background: #2e9b4f; color: #fff; } .stt.low { background: #f2b705; color: #111; } .stt.none { background: #d93a2b; color: #fff; }
@media (max-width: 640px) { .rstats { grid-template-columns: 1fr; } table.st td.fl { width: auto; } }
@media (max-width: 640px) {
  .row2 { grid-template-columns: 1fr; }
  .qt thead { display: none; }
  .qt tr { display: grid; grid-template-columns: 30px 1fr 30px; grid-template-areas: "no q x" "no c x"; border-bottom: 1px solid var(--line); padding: 6px 0; }
  .qt td { border: 0; padding: 3px 2px; } .qt td.no { grid-area: no; padding-top: 12px; } .qt td.q { grid-area: q; } .qt td.chg { grid-area: c; } .qt td.x { grid-area: x; }
}

/* Setup theo tháng (05/11/2026): câu hỏi theo nhóm, xem / sửa bản đã gửi */
.mrow { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
.mrow > div { flex: 1; min-width: 180px; }
.gsec { margin-top: 14px; border: 1.5px solid #ececec; border-radius: 22px; padding: 12px 14px 14px; }
.gsec h3 { margin: 0 0 6px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.gsec h3 .k { font-size: 12px; font-weight: 700; color: var(--muted); }
.gsec h3 .no2 { width: 24px; height: 24px; border-radius: 50%; background: #111; color: #fff; display: grid; place-items: center; font-size: 12px; }
.qline { display: grid; grid-template-columns: 28px 1fr 36px; gap: 6px; align-items: start; padding: 4px 0; }
.qline .i { font-weight: 700; color: var(--muted); padding-top: 14px; text-align: center; font-size: 13px; }
.qline textarea { min-height: 50px !important; font-size: 15px; font-weight: 600; overflow: hidden; resize: none; }
.qline button { border: 0; background: none; font-size: 20px; color: #b5b2ad; cursor: pointer; padding: 12px 6px; } .qline button:hover { color: var(--bad); }
.addg { margin-top: 6px; }
.view ol { margin: 6px 0 0; padding-left: 22px; } .view li { margin: 4px 0; font-size: 14.5px; }
.view h4 { margin: 14px 0 4px; font-size: 14px; }
.vhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.okline { display: inline-flex; gap: 8px; align-items: center; font-weight: 700; }
.okline i { width: 22px; height: 22px; border-radius: 50%; background: #111; color: #fff; display: grid; place-items: center; font-style: normal; font-size: 13px; }
</style>
</head>

      if (!r.ok) throw new Error(r.error);
      st.rows = fit(r.rows); st.info = T('reuseOk')(r.rows.length, ML(r.cycle)); keep();
    } catch (x) { ru.disabled = false; toast(T('reuseErr') + x.message); }
  };
  const tp = $('#tpl'); if (tp) tp.onclick = () => { if (st.rows.some(r => r.q.trim()) && !confirm(T('reuseAsk'))) return; st.rows = fromTemplate(); st.info = T('tplOk'); keep(); };
  document.querySelectorAll('#bseg button').forEach(b => b.onclick = () => { st.brand = b.dataset.b; keep(); });
  document.querySelectorAll('.sz[data-k]').forEach(b => b.onclick = () => { const k = b.dataset.k, i = st.samples.indexOf(k); if (i >= 0) st.samples.splice(i, 1); else { st.samples.push(k); if (!st.qty[k]) st.qty[k] = DEF_QTY; } keep(); });
  document.querySelectorAll('input[data-q]').forEach(el => el.oninput = () => { const v = Math.round(+el.value); if (v > 0) { st.qty[el.dataset.q] = Math.min(999, v); save(); } });
  document.querySelectorAll('select[data-addfl]').forEach(el => el.onchange = () => { if (el.value) { st.extra.push(el.dataset.addfl + '|' + el.value); keep(); } });
  document.querySelectorAll('.sz[data-all]').forEach(b => b.onclick = () => { const ks = b.dataset.all.split(';').filter(Boolean), all = ks.every(k => st.samples.includes(k));
    st.samples = all ? st.samples.filter(k => !ks.includes(k)) : [...new Set(st.samples.concat(ks))]; keep(); });
  const df = $('#df'); if (df) df.onchange = e => { st.dateFrom = e.target.value; if (st.dateTo && st.dateTo < st.dateFrom) st.dateTo = ''; keep(); };
  const dt = $('#dt'); if (dt) dt.onchange = e => { st.dateTo = e.target.value; keep(); };
}
function startEdit(m) {
  editing = true;
  if (m) { st.rows = fit(m.rows); st.samples = m.samples.map(s => sKey(s.brand, s.flavor, s.sku)); st.qty = Object.fromEntries(m.samples.map(s => [sKey(s.brand, s.flavor, s.sku), +s.qty || DEF_QTY])); st.extra = []; st.dateFrom = m.dateFrom; st.dateTo = m.dateTo; st.info = ''; }
  save(); render(); scrollTo(0, 0);
}
// Đổi tháng / team: tải bản đã gửi của tháng đó; có bản nháp trên máy thì mở tiếp bản nháp
async function load() {
  mine = null; plan = null; editing = false; st.info = ''; loading = !!st.team;
  st.rows = []; st.samples = []; st.qty = {}; st.extra = []; st.dateFrom = ''; st.dateTo = '';
  render();
  if (!st.team) return;
  const [r, p] = await Promise.all([
    PC.get(`mySetup&cycle=${st.cycle}&team=${encodeURIComponent(st.team)}&t=${encodeURIComponent(PC.token())}`).catch(e => ({ ok: false, error: e.message })),
    PC.get('plan&cycle=' + st.cycle).catch(() => ({}))]);
  if (!r.ok) toast(r.error || '?');
  loading = false; mine = r.ok ? r.mine : null; plan = p.ok ? p : null;
  const d = readDraft();
  if (!mine) { editing = true; if (d) Object.assign(st, d); else { st.rows = fromTemplate(); st.info = T('tplOk'); } }
  render();
}
$('#cancel').onclick = () => { dropDraft(); editing = false; render(); scrollTo(0, 0); };
$('#send').onclick = async () => {
  if (missing().length || sending) return;
  sending = true; status();
  try {
    const rows = st.rows.filter(r => r.q.trim()).map((r, i) => [r, i]).sort((a, b) => G.indexOf(a[0].g) - G.indexOf(b[0].g) || a[1] - b[1]).map(([r]) => ({ g: r.g, q: r.q.trim(), c: '' }));
    const r = await PC.post('setupSave', { cycle: st.cycle, team: st.team, rows,
      samples: hasPlan() ? st.samples.map(k => { const [brand, flavor, sku] = k.split('|'); return { brand, flavor, sku, qty: st.qty[k] || DEF_QTY }; }) : [], dateFrom: hasPlan() ? st.dateFrom : '', dateTo: hasPlan() ? st.dateTo : '' });
    if (!r.ok) throw new Error(r.error || '?');
    openReview(r);
  } catch (e) { toast(T('sendErr') + (e.message || e)); }
  sending = false; status();
};
$('#doneOk').onclick = () => { $('#done').classList.remove('on'); scrollTo(0, 0); };
function openReview(r) {
  review = r;
  $('#rvHead').textContent = T('rvHead'); $('#rvTxt').textContent = T('rvTxt')(r.team, ML(r.cycle), r.rows.length, r.samples.length);
  $('#rvBody').innerHTML = `<div class="rvsec"><h4>${T('rvQ')}</h4><ol class="rlist">${r.rows.map(x => `<li>${esc(x.q)}</li>`).join('')}</ol></div>
    ${r.samples.length ? `<div class="rvsec"><h4>${T('rvS')} · ${r.samples.length}</h4><table class="rtbl">${r.samples.map(s => `<tr><td>${esc(s.brand)} · ${esc(s.flavor)}</td><td>${esc(s.sku)}</td><td>× ${s.qty}</td></tr>`).join('')}</table></div>` : ''}
    ${r.dateFrom ? `<div class="rvsec"><h4>${T('rvD')}</h4><b>${dmy(r.dateFrom)} – ${dmy(r.dateTo)}</b></div>` : ''}`;
  $('#rvBack').textContent = T('rvBack'); $('#rvOk').textContent = T('rvOk'); $('#rvOk').disabled = false;
  $('#review').classList.add('on');
}
$('#rvBack').onclick = () => { $('#review').classList.remove('on'); };
$('#rvOk').onclick = async () => {
  if (!review) return;
  $('#rvOk').disabled = true; $('#rvOk').textContent = T('saving');
  try {
    const r = await PC.post('setupConfirm', { cycle: review.cycle, team: review.team, at: review.at });
    if (!r.ok) throw new Error(r.error || '?');
    plan = r; mine = r.mine; dropDraft(); editing = false;
    $('#review').classList.remove('on');
    $('#doneHead').textContent = T('savedH'); $('#doneTxt').textContent = T('savedT')(TEAMS.every(t => r.teams[t])); $('#doneOk').textContent = T('ok');
    $('#done').classList.add('on');
    render();
  } catch (e) { toast(T('sendErr') + (e.message || e)); $('#rvOk').disabled = false; $('#rvOk').textContent = T('rvOk'); }
};
(async () => {
  const g = await PC.guard('setup'); if (!g) return;
  me = g.user; PC.bar($('#pcbar'), 'Setup');
  const s = await PC.get('months').catch(() => ({}));
  current = s.current || new Date().toISOString().slice(0, 7);
  st.cycle = current; st.team = me.role === 'ADMIN' ? '' : me.role;
  load();
  PC.get('catalog').then(r => { if (!r.ok) throw new Error(r.error); products = r.products.filter(p => PLAN_BRANDS.some(([b]) => b === p.brand)); render(); })
    .catch(e => { catErr = e.message || String(e); render(); });
})();
</script>
