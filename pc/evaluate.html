<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>MQM · Đánh giá mẫu</title>
<style>
:root {
  /* Cùng tông đỏ với app đăng ký mẫu (biến vẫn tên navy để giữ nguyên các chỗ dùng) */
  --navy: #c8102e; --navy-2: #9e0c24; --red: #c8102e; --blue: #1f3864; --ink: #1b1b1f; --muted: #6e6e76; --line: #e7e5e2; --page: #f6f4f1; --card: #fff;
  --g: #2e9b4f; --g-soft: #e7f6ec; --y: #e8a400; --y-soft: #fff4d6; --r: #d93a2b; --r-soft: #fde8e6; --radius: 18px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, "Malgun Gothic", "Apple SD Gothic Neo", Arial, sans-serif; }
.hero .right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.lang { display: inline-flex; background: rgba(255,255,255,.16); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { border: 0; background: none; color: #fff; font: inherit; font-size: 12px; font-weight: 800; padding: 5px 10px; border-radius: 999px; cursor: pointer; opacity: .8; }
.lang button.on { background: #fff; color: var(--navy); opacity: 1; }
.hero { background: linear-gradient(135deg, var(--navy), var(--navy-2)); color: #fff; padding: 20px 18px 50px; }
.hero .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.hero .brand { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .22em; font-weight: 700; opacity: .9; }
.hero .brand svg { width: 28px; height: 18px; }
.hero h1 { margin: 10px 0 4px; font-size: 25px; font-weight: 800; }
.hero p { margin: 0; opacity: .85; font-size: 13.5px; }
.who { background: rgba(255,255,255,.14); border: 0; color: #fff; font: inherit; font-size: 12.5px; font-weight: 700; padding: 6px 12px; border-radius: 999px; }
.whobox { display: flex; align-items: center; gap: 10px; background: #f3f3f5; border-radius: 16px; padding: 10px 12px 10px 14px; margin: 0 0 12px; }
.whobox div { flex: 1; min-width: 0; } .whobox b { display: block; font-size: 16px; } .whobox small { display: block; color: #8a8a92; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logout { flex: none; border: 1.5px solid #f0c4cb !important; background: #fff; border: 0; color: #c8102e; font: inherit; font-size: 12.5px; font-weight: 800; padding: 6px 12px; border-radius: 999px; cursor: pointer; } .logout.arm { background: #c8102e; color: #fff; box-shadow: 0 0 0 2px #fff; }
.back { background: none; border: 0; color: #fff; font: inherit; font-weight: 700; padding: 0; cursor: pointer; opacity: .9; }
.wrap { max-width: 600px; margin: -32px auto 0; padding: 0 14px 120px; }
.card { background: var(--card); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 18px rgba(0,0,0,.05); }
.label { font-size: 12.5px; font-weight: 700; color: var(--muted); margin-bottom: 6px; display: block; }
.label .req { color: var(--red); }
.field { margin-bottom: 14px; }
input, textarea { width: 100%; font: inherit; font-size: 16px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink); }
textarea { min-height: 70px; resize: vertical; }
input:focus, textarea:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 3px #fdecee; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 14px; font: inherit; font-weight: 700; font-size: 14px; color: var(--ink); cursor: pointer; }
.chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }
.chip.sm { padding: 6px 11px; font-size: 13px; font-weight: 600; }
.chip.sm.on { background: var(--ink); border-color: var(--ink); }
.chip .cnt { font-weight: 600; opacity: .65; margin-left: 4px; font-size: 12px; }
.btn { border: 0; background: var(--navy); color: #fff; font: inherit; font-weight: 800; font-size: 16px; padding: 14px 22px; border-radius: 14px; cursor: pointer; }
.btn:disabled { opacity: .45; }
.btn.full { width: 100%; }
.btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); }
.btn.sm { font-size: 13px; padding: 7px 12px; border-radius: 10px; }
.bhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 12px 0 8px; }
.bhead b { font-size: 13px; color: var(--muted); letter-spacing: .04em; }
.ball { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #fdecee; border-radius: 14px; padding: 10px 12px; }
.ball span { font-size: 13.5px; }
.tools { display: flex; gap: 8px; margin-bottom: 12px; align-items: center; }
.tools input { flex: 1; padding: 10px 14px; }
.stat { font-size: 13px; color: var(--muted); margin: 0 2px 10px; display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.stat b { color: var(--ink); }
.linkbtn { background: none; border: 0; color: var(--navy); font: inherit; font-weight: 800; font-size: 13px; cursor: pointer; padding: 0; text-decoration: underline; }
.sample { display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; background: #fff; border-radius: 16px; padding: 10px; margin-bottom: 8px;
  box-shadow: 0 1px 2px rgba(0,0,0,.04); border: 1.5px solid transparent; cursor: pointer; width: 100%; text-align: left; font: inherit; color: inherit; }
.sample:active { border-color: var(--navy); }
.sample .th { width: 64px; height: 64px; border-radius: 12px; background: #eeece8 center/cover; display: grid; place-items: center; color: #aaa; font-size: 10px; }
.sample .id { font-size: 12px; font-weight: 800; color: var(--red); }
.sample b { display: block; font-size: 15px; }
.sample small { color: var(--muted); font-size: 12.5px; }
.sample .st { text-align: right; font-size: 12px; color: var(--muted); }
.sample.done { opacity: .6; }
.tag { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; background: #eef1f7; color: var(--blue); }
.tag.comp { background: #f4ecf8; color: #6d2f8e; }
.tag.ok { background: var(--g-soft); color: var(--g); }
.note { background: #fff8e6; border: 1.5px solid #f3d27a; font-size: 13.5px; }
.head { display: flex; gap: 14px; align-items: center; }
.head .th { width: 84px; height: 84px; border-radius: 14px; background: #eeece8 center/cover; flex: none; }
.head .id { font-weight: 800; color: var(--red); font-size: 13px; }
.head b { font-size: 18px; display: block; }
.head small { color: var(--muted); }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin: 2px 0 12px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.attr h3 { margin: 0 0 10px; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; }
.attr h3 span { font-size: 12px; color: var(--muted); font-weight: 600; }
.scale { display: grid; grid-template-columns: repeat(9, 1fr); gap: 5px; margin-bottom: 10px; }
.scale button { border: 1.5px solid var(--line); background: #fff; border-radius: 10px; height: 44px; font: inherit; font-weight: 800; font-size: 16px; cursor: pointer; color: var(--ink); }
.scale button.g { border-color: #cfe9d7; } .scale button.y { border-color: #f4e1a8; } .scale button.r { border-color: #f5c9c3; }
.scale button.g.on { background: var(--g); border-color: var(--g); color: #fff; }
.scale button.y.on { background: var(--y); border-color: var(--y); color: #fff; }
.scale button.r.on { background: var(--r); border-color: var(--r); color: #fff; }
.attr .chips { margin-bottom: 10px; }
.attr.fine { box-shadow: inset 4px 0 0 var(--g), 0 1px 2px rgba(0,0,0,.04); } .attr.bad { box-shadow: inset 4px 0 0 var(--r), 0 1px 2px rgba(0,0,0,.04); }
.seg.okis button.on.ok { background: var(--g); color: #fff; } .seg.okis button.on.is { background: var(--r); color: #fff; }
.pick { margin-top: 12px; } .pick .scale { margin: 6px 0 0; }
details.ref { margin-top: 10px; } details.ref summary { font-size: 12.5px; color: var(--muted); font-weight: 700; cursor: pointer; padding: 4px 0; }
details.ref .scale { margin: 8px 0 0; } .scale.ref button { height: 36px; font-size: 14px; }
.attr textarea { min-height: 64px; font-size: 15px; }
.attr.cause { border: 1.5px solid var(--r-soft); }
.attr input { padding: 10px 12px; font-size: 15px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #f1efec; border-radius: 14px; padding: 4px; gap: 4px; }
.seg button { border: 0; background: none; padding: 10px 4px; border-radius: 11px; font: inherit; font-size: 13.5px; font-weight: 700; color: var(--muted); cursor: pointer; }
.seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.95); backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 12px 14px calc(12px + env(safe-area-inset-bottom)); }
.bar .in { max-width: 600px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
.bar .prog { flex: 1; font-size: 12.5px; color: var(--muted); }
.bar .prog .track { height: 6px; background: #eee; border-radius: 999px; margin-top: 6px; overflow: hidden; }
.bar .prog .track i { display: block; height: 100%; background: var(--navy); border-radius: 999px; transition: width .2s; }
.toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 13.5px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; max-width: 90vw; }
.toast.on { opacity: 1; }
.empty { text-align: center; color: var(--muted); padding: 26px 10px; }
/* Câu hỏi của chu kỳ (từ RD / MKT, app setup-request) */
.cq { border-top: 1px solid var(--line); padding: 12px 0 10px; }
.cq:first-of-type { border-top: 0; padding-top: 4px; }
.cq-q { font-size: 14px; line-height: 1.45; margin-bottom: 6px; }
.cq-c { display: block; color: var(--muted); font-size: 12px; margin: -2px 0 8px; }
.cq.bad .cq-q b { color: var(--bad); } .cq.fine .cq-q b { color: var(--green, #2e9b4f); }
.cq textarea { margin-top: 4px; }
.cqprev summary { cursor: pointer; font-size: 14px; } .cqprev summary span { color: var(--muted); font-size: 12px; margin-left: 6px; }
.cqprev ol { margin: 10px 0 4px; padding-left: 22px; font-size: 13.5px; line-height: 1.5; } .cqprev li + li { margin-top: 6px; }
.gtitle { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #c8102e; margin: 18px 4px 8px; }
.miss { margin-top: 14px; } .miss h3 { margin: 0 0 6px; font-size: 14px; color: var(--muted); }
.sample.na { opacity: .55; cursor: not-allowed; background: #f6f5f3; } .sample.na .th { background: #ececec; }
.tag.na { background: #fdecee; color: #d93a2b; } .tag.low { background: #fff6dc; color: #8a6200; }

/* 10/11: tab Bao bì / Cảm quan, câu hỏi chung 1 khung, Có vấn đề (trái, đỏ) · Ổn (phải, xanh), ảnh minh chứng */
.etabs { display: flex; gap: 6px; margin: 0 0 12px; } .etabs button { flex: 1; border: 0; background: #efefef; color: #111; font: inherit; font-weight: 800; font-size: 14.5px; padding: 12px 10px; border-radius: 999px; cursor: pointer; }
.etabs button.on { background: #111; color: #fff; }
.scorenote { background: #fff8e6 !important; border: 1.5px solid #f3d27a !important; font-size: 14px; font-weight: 600; }
.qbox .qg { font-size: 12.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: #c8102e; margin: 16px 0 4px; } .qbox .qg:first-of-type { margin-top: 4px; }
.qrow { border-top: 1px solid #eee; padding: 12px 0; } .qbox .qg + .qrow { border-top: 0; }
.qrow .qt { display: flex; justify-content: space-between; gap: 10px; font-size: 15px; font-weight: 600; margin-bottom: 8px; } .qrow .qt span { color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap; }
.yn { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.yn button { border: 2px solid #e6e6e6; background: #fff; border-radius: 999px; padding: 10px 6px; font: inherit; font-weight: 800; font-size: 14.5px; color: #6b6b6b; cursor: pointer; }
.yn button.is.on { background: #d93a2b !important; border-color: #d93a2b !important; color: #fff !important; }
.yn button.ok.on { background: #2e9b4f !important; border-color: #2e9b4f !important; color: #fff !important; }
.yn button.is:hover { border-color: #f0b4ad; } .yn button.ok:hover { border-color: #a9d8b7; }
.qrow.bad .qt { color: #b3261e; }
.qrow .pick .scale button { height: 36px; font-size: 14px; }
.shot2 { width: 100%; border: 2px dashed #cdcdcd; background: #fafafa; border-radius: 20px; padding: 16px; font: inherit; font-weight: 800; font-size: 15px; color: #111; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
.ph3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; } .ph3 div { position: relative; aspect-ratio: 1; border-radius: 14px; background: #eee center/cover; }
.ph3 button { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; }

/* 11/11: 2 ô chọn loại đánh giá */
.typegrid { display: grid; gap: 14px; margin-bottom: 12px; }
.typebtn { display: flex; flex-direction: column; align-items: stretch; gap: 10px; border: 0; border-radius: 28px; padding: 28px 24px 22px; font: inherit; cursor: pointer; text-align: left; min-height: 210px; background: #f4f4f4; color: #111; }
.typebtn.t1 { background: #c8102e; color: #fff; }
.typebtn b { font-size: 30px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
.typebtn .td { font-size: 16px; line-height: 1.5; font-weight: 400; color: #6b6b6b; } .typebtn.t1 .td { color: rgba(255,255,255,.88); }
.typebtn .tf { margin-top: auto; display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 700; padding-top: 12px; }
.typebtn .ta { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-size: 20px; background: #fff; color: #111; } .typebtn.t1 .ta { background: rgba(255,255,255,.18); color: #fff; }
.typebtn:active { transform: scale(.99); }
.typepill { display: flex; justify-content: space-between; align-items: center; background: #111; color: #fff; border-radius: 999px; padding: 10px 18px; margin-bottom: 12px; font-weight: 800; } .typepill .linkbtn { color: #fff; }
@media (min-width: 640px) { .typegrid { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="pc-bar" id="pcbar"></div>
<header class="hero" id="hero"></header>
<main class="wrap" id="app"><div class="card empty">…</div></main>
<div class="bar" id="bar" hidden></div>
<div class="toast" id="toast"></div>
<input type="file" accept="image/*" capture="environment" id="cam" hidden>
<script src="pc.js?v=20261112a"></script>
<script>
// MQM 1A · App đánh giá mẫu. Nhập tên + bộ phận → chọn brand mình phụ trách → chọn mẫu → chấm theo bộ câu hỏi của bộ phận.
// Dữ liệu ghi vào Google Sheet "MQM 1A - Đánh giá mẫu" qua Apps Script (Api.gs), gọi không kèm tài khoản Google.
// Nút VI / 한국어 chỉ đổi chữ hiển thị; giá trị ghi vào Sheet (tên lỗi, so với đối thủ) giữ nguyên để bảng tổng hợp không lẫn 2 thứ tiếng.
// Bộ phận chấm. Chuyên môn (EXPERT) mới ghi nguyên nhân & giải pháp tạm thời; bộ phận khác chỉ trả lời câu hỏi (anh Thái 05/11/2026)
const DEPTS = ['FQS', 'R&D', 'MKT', 'PI', 'Design', 'ENG', 'Pro', 'QA', 'Sales', 'SCM', 'PUR', 'Khác'];
// Nhóm chuyên gia (anh Thái 10/11): MKT, PI, Design, R&D — chỉ nhóm này ghi nguyên nhân & giải pháp (nhận định chung)
const EXPERT = ['MKT', 'PI', 'Design', 'R&D'];
// Tab đánh giá theo bộ phận: MKT 2 tab (Bao bì + Cảm quan) · PI, Design: Bao bì · R&D và bộ phận khác: Cảm quan
const TABS = { pkg: { vi: 'Đánh giá bao bì', ko: '포장 평가', groups: ['Bao bì', 'In ấn'] }, sen: { vi: 'Đánh giá cảm quan', ko: '관능 평가', groups: ['Ngoại quan', 'Cấu trúc', 'Hương vị'] } };
const tabsFor = d => d === 'MKT' ? ['pkg', 'sen'] : ['PI', 'Design'].includes(d) ? ['pkg'] : ['sen'];
let etab = (() => { try { return localStorage.getItem('mqm-pc-eval-tab') || ''; } catch (e) { return ''; } })();
// 11/11: bấm vào Đánh giá mẫu → chọn trước Cảm quan hay Bao bì (2 ô to), rồi mới nhập tên. Bộ phận theo loại: Bao bì = MKT / PI / Design; Cảm quan = các bộ phận khác (trừ PI, Design)
let etype = (() => { try { return localStorage.getItem('mqm-pc-eval-type') || ''; } catch (e) { return ''; } })();
const setType = t => { etype = t; try { t ? localStorage.setItem('mqm-pc-eval-type', t) : localStorage.removeItem('mqm-pc-eval-type'); } catch (e) {} };
const deptsFor = t => t === 'pkg' ? ['MKT', 'PI', 'Design'] : DEPTS.filter(d => !['PI', 'Design'].includes(d));
const curTab = () => { const ts = me ? tabsFor(me.dept) : ['sen']; if (!ts.includes(etab)) etab = ts[0]; return etab; };
// Chỉ còn câu hỏi của tháng (bỏ 4 ô Package / Appearance / Texture / Flavor cố định). Thứ tự từ ngoài vào trong.
// MKT / PI / Design: câu hỏi Bao bì, In ấn · R&D: Ngoại quan, Cấu trúc, Hương vị · bộ phận khác: tất cả
const G = PC.GROUPS;
const DEPT_GROUPS = { MKT: ['Bao bì', 'In ấn'], PI: ['Bao bì', 'In ấn'], Design: ['Bao bì', 'In ấn'], 'R&D': ['Ngoại quan', 'Cấu trúc', 'Hương vị'] };
// Vấn đề hay gặp theo nhóm (giá trị lưu)
const GTAGS = {
  'Bao bì': ['Xì / rò khí', 'Ít khí', 'Seal yếu', 'Nhăn', 'Rách', 'Biến dạng'],
  'In ấn': ['In lệch / mờ', 'Lem màu', 'Code date mờ', 'Sai thông tin', 'Nhãn lỗi'],
  'Ngoại quan': ['Vỡ / vụn', 'Đốm đen', 'Cháy / sẫm màu', 'Nhạt màu', 'Biến dạng', 'Bong lớp phủ', 'Chảy / bloom', 'Không đều'],
  'Cấu trúc': ['Ỉu / mềm', 'Cứng', 'Khô', 'Đặc', 'Bở', 'Dính răng', 'Bột'],
  'Hương vị': ['Nhạt vị', 'Lạ vị', 'Đắng', 'Quá ngọt', 'Ôi dầu', 'Khét', 'Chua / hỏng'],
};
// 11/11: lỗi theo từng câu hỏi (Bảng đánh giá cảm quan khoai tây · Defect checklist), chỉ tiếng Việt.
// Khớp theo từ khoá trong câu hỏi; câu không khớp thì dùng danh sách chung của nhóm (GTAGS).
const QTAGS = [
  { g: 'Ngoại quan', re: /gia vị|ssn/, tags: ['SSN không đều (vón cục)', 'SSN ít', 'SSN quá nhiều', 'Vảy gia vị không đều (ớt, rong biển / tảo, rau)'] },
  { g: 'Ngoại quan', re: /màu|bề mặt|cháy|đốm/, tags: ['Cháy nguyên lát / cháy đốm', 'Khoai xanh', 'Đốm đen'] },
  { g: 'Ngoại quan', re: /nguyên vẹn|hình dạng|vỡ|gãy/, tags: ['Gãy vụn', 'Khoai bị gập', 'Lát cắt không tròn tự nhiên'] },

  b.innerHTML = `<div class="in"><div class="prog">${m.length ? esc(T('need') + m.join(', ')) : T('ready')}<div class="track"><i style="width:${n / cq.length * 100}%"></i></div></div><button class="btn" id="save" ${m.length ? 'disabled' : ''}>${T('save')}</button></div>`;
  $('#save').onclick = save;
}
function render() {
  $('#hero').innerHTML = hero();
  const wb = me && view !== 'score' && view !== 'review' ? `<div class="whobox"><div><small>${T('name')}</small><b>${esc(me.name)}</b><small>${esc(me.dept)} · ${me.brands === 'all' ? T('allBrands') : esc(T('nBrands')(me.brands.length))}</small></div><button class="logout" id="logout">${T('logout')}</button></div>` : '';
  $('#app').innerHTML = !me ? viewLogin() : wb + (view === 'score' ? viewScore() : view === 'review' ? viewReview() : view === 'brands' ? viewBrands() : viewList());
  bar(); bind();
}
function bindPicker() {
  const all = $('[data-all]'); if (all) all.onclick = () => { draft.brands = draft.brands === 'all' ? [] : 'all'; render(); };
  document.querySelectorAll('[data-group]').forEach(g => g.onclick = () => {
    const grp = (brandGroups().find(x => x[0] === g.dataset.group) || [, []])[1].map(x => x[0]);
    const cur = draft.brands === 'all' ? allBrands() : draft.brands;
    draft.brands = [...new Set(cur.concat(grp))];
    if (draft.brands.length === allBrands().length) draft.brands = 'all';
    render();
  });
  document.querySelectorAll('[data-brand]').forEach(c => c.onclick = () => {
    const b = c.dataset.brand, cur = draft.brands === 'all' ? allBrands() : draft.brands.slice();
    const i = cur.indexOf(b); i >= 0 ? cur.splice(i, 1) : cur.push(b);
    draft.brands = cur; render();
  });
}
function bind() {
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
    lang = b.dataset.lang; try { localStorage.setItem('mqm1a-lang', lang); } catch (e) {}
    const y = scrollY; render(); scrollTo(0, y);
  });
  // Đổi người phải Đăng xuất (bấm 2 lần); đăng xuất xong nhập lại từ đầu, không điền sẵn (anh Thái 09/11)
  const lo = $('#logout'); if (lo) lo.onclick = () => {
    if (!lo.classList.contains('arm')) { lo.classList.add('arm'); lo.textContent = T('logoutArm'); clearTimeout(lo._t); lo._t = setTimeout(() => { const b = $('#logout'); if (b) { b.classList.remove('arm'); b.textContent = T('logout'); } }, 3500); return; }
    draft = { name: '', dept: '', brands: [] }; view = 'list'; cur = null; ev = null; setType(''); setMe(null); render(); scrollTo(0, 0); toast(T('loggedOut'));
  };
  const back = $('#back'); if (back) back.onclick = () => { view = 'list'; render(); scrollTo(0, 0); };
  if (!me) {
    document.querySelectorAll('[data-etype]').forEach(b => b.onclick = () => { setType(b.dataset.etype); if (draft.dept && !deptsFor(etype).includes(draft.dept)) draft.dept = ''; render(); scrollTo(0, 0); });
    const ct = $('#chgType'); if (ct) ct.onclick = () => { setType(''); render(); };
    if (!etype) return;
    const name = $('#name'); name.oninput = () => { draft.name = name.value; };
    document.querySelectorAll('#dept button').forEach(b => b.onclick = () => { draft.dept = b.dataset.v; render(); });
    bindPicker();
    $('#go').onclick = () => {
      const nm = draft.name.trim();
      if (!nm || !draft.dept) return toast(T('needName'));
      if (draft.brands !== 'all' && !draft.brands.length) return toast(T('needBrand'));
      etab = etype; try { localStorage.setItem('mqm-pc-eval-tab', etab); } catch (e) {}
      setMe({ name: nm, dept: draft.dept, brands: draft.brands }); view = 'list'; render();
    };
    return;
  }
  if (view === 'brands') {
    bindPicker();
    $('#saveBrands').onclick = () => {
      if (draft.brands !== 'all' && !draft.brands.length) return toast(T('needBrand'));
      setMe({ ...me, brands: draft.brands }); view = 'list'; render(); scrollTo(0, 0);
    };
    return;
  }
  if (view === 'list') {
    const ms = $('#month'); if (ms) ms.onchange = () => { cycle = ms.value; PC.setMonth(cycle); loadAll(); };
    const q = $('#q'); if (q) q.oninput = () => { filt.q = q.value; const p = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
    document.querySelectorAll('[data-show]').forEach(b => b.onclick = () => { filt.show = b.dataset.show; render(); });
    document.querySelectorAll('[data-etab]').forEach(b => b.onclick = () => { etab = b.dataset.etab; try { localStorage.setItem('mqm-pc-eval-tab', etab); } catch (e) {} cq = cqFor(); render(); });
    document.querySelectorAll('.sample').forEach(b => b.onclick = () => mine(b.dataset.id) ? openReview(b.dataset.id) : open(b.dataset.id));
    const eb = $('#editBrands'); if (eb) eb.onclick = () => { draft.brands = me.brands; view = 'brands'; render(); scrollTo(0, 0); };
    return;
  }
  if (!cq.length) return;
  const keep = () => { const y = scrollY; render(); scrollTo(0, y); };
  // Điểm: bấm lại số đang chọn để bỏ
  document.querySelectorAll('.scale').forEach(sc => sc.querySelectorAll('button').forEach(b => b.onclick = () => {
    const x = ev.xq[sc.dataset.s], v = +b.dataset.v; x.score = x.score === v ? null : v; sc.querySelectorAll('button').forEach(y => y.classList.toggle('on', +y.dataset.v === x.score)); bar();
  }));
  const ao = $('#allOk'); if (ao) ao.onclick = () => { cq.forEach(q => { ev.xq[q.id].st = 'ok'; }); keep(); };
  document.querySelectorAll('[data-xq]').forEach(sg => sg.querySelectorAll('button').forEach(b => b.onclick = () => { ev.xq[sg.dataset.xq].st = b.dataset.v; keep(); }));
  document.querySelectorAll('[data-xd]').forEach(i => i.oninput = () => { ev.xq[i.dataset.xd].d = i.value; bar(); });
  // Lưu giá trị gốc của lỗi (data-tag), không lưu chữ đã dịch
  document.querySelectorAll('[data-t]').forEach(tg => tg.querySelectorAll('button').forEach(b => b.onclick = () => {
    const a = ev.xq[tg.dataset.t].tags, t = b.dataset.tag, i = a.indexOf(t); i >= 0 ? a.splice(i, 1) : a.push(t); b.classList.toggle('on', i < 0); bar();
  }));
  document.querySelectorAll('[data-pick]').forEach(pg => pg.querySelectorAll('button').forEach(b => b.onclick = () => {
    const a = ev[pg.dataset.pick], x = b.dataset.x, i = a.indexOf(x); i >= 0 ? a.splice(i, 1) : a.push(x); b.classList.toggle('on', i < 0); bar();
  }));
  const so = $('#solution'); if (so) so.oninput = () => { ev.solution = so.value; bar(); };
  const sh = $('#shot'); if (sh) sh.onclick = () => $('#cam').click();
  document.querySelectorAll('[data-delph]').forEach(b => b.onclick = () => { ev.photos.splice(+b.dataset.delph, 1); keep(); });
}
// 11/11: xem lại bài đã chấm (chỉ xem, không sửa)
let myEv = null, myEvCyc = '';
async function openReview(id) {
  cur = samples.find(s => s.id === id); if (!cur) return;
  view = 'review'; render(); scrollTo(0, 0);
  if (!myEv || myEvCyc !== cycle) { try { const r = await api.get(`myEvals&cycle=${encodeURIComponent(cycle)}&name=${encodeURIComponent(me.name)}`); if (!r.ok) throw new Error(r.error); myEv = r.items; myEvCyc = cycle; } catch (e) { toast(e.message); myEv = []; } }
  if (view === 'review') render();
}
function viewReview() {
  const s = cur, head = `<div class="card head"><div class="th" style="${s.thumb ? `background-image:url(${s.thumb})` : ''}"></div><div><span class="id">${esc(s.id)}</span> ${originTag(s)}<b>${esc(s.brand)} · ${esc(s.flavor)}</b>
      <small>${s.sku ? esc(s.sku) + ' · ' : ''}${T('mfdShort')} ${dmy(s.mfd)} · ${T('buyShort')} ${dmy(s.buyDate)}</small></div></div>`;
  if (!myEv || myEvCyc !== cycle) return head + `<div class="card empty">${T('loadingMine')}</div>`;
  const e = myEv.find(x => x.sampleId === s.id);
  if (!e || !e.answers.length) return head + `<div class="card empty">${T('noAns')}</div>`;
  const ans = e.answers.slice().sort((a, b) => G.indexOf(a.g) - G.indexOf(b.g));
  return head + `<div class="card note">🔒 ${T('reviewNote')} · ${esc(new Date(e.at).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }))}</div>
    <div class="card qbox"><div class="stat" style="margin:0 0 4px"><b style="font-size:15px">${T('reviewH')}</b></div>
    ${G.filter(g => ans.some(a => a.g === g)).map(g => `<div class="qg">${esc(gName(g))}</div>` + ans.filter(a => a.g === g).map((a, i) => { const bad = a.result === 'Có vấn đề';
      return `<div class="qrow ${bad ? 'bad' : 'fine'}"><div class="qt"><div>${esc(lang === 'ko' ? qText(PC.stripG ? PC.stripG(a.q) : a.q) : a.q)}</div><span>${a.score !== '' && a.score != null ? 'Điểm ' + esc(a.score) : ''}</span></div>
        <div class="yn"><button class="is ${bad ? 'on' : ''}" disabled>! ${T('issue')}</button><button class="ok ${bad ? '' : 'on'}" disabled>✓ ${T('ok')}</button></div>
        ${bad && (a.tags.length || a.note) ? `<p class="cq-c" style="margin:8px 0 0">${a.tags.map(t => `<span class="tag">${esc(L('tags', t))}</span>`).join(' ')} ${esc(a.note)}</p>` : ''}</div>`; }).join('')).join('')}</div>
    ${e.solution || e.causeIn.length || e.causeOut.length ? `<div class="card attr cause"><h3>${T('causeTitle')}</h3><p class="cq-c">${esc(e.causeIn.concat(e.causeOut).map(c => L('cause', c)).join(', '))}</p><p style="margin:6px 0">${esc(e.solution)}</p><p class="cq-c">${T('owners')} ${esc(e.owners.join(', '))}</p></div>` : ''}
    ${e.photos.length ? `<div class="card"><h3 style="margin:0 0 10px;font-size:15px">${T('yourPhotos')}</h3><div class="ph3">${e.photos.map(p => `<a href="https://drive.google.com/file/d/${encodeURIComponent(p.id)}/view" target="_blank" rel="noopener" style="display:block;aspect-ratio:1;border-radius:14px;background:#eee url(${p.t}) center/cover"></a>`).join('')}</div></div>` : ''}`;
}
function open(id) {
  cur = samples.find(s => s.id === id); if (!cur) return;
  ev = { sampleId: id, causeIn: [], causeOut: [], solution: '', owners: [], photos: [], xq: Object.fromEntries(cq.map(q => [q.id, { st: '', d: '', score: null, tags: [] }])) };
  view = 'score'; render(); scrollTo(0, 0);
}
async function save() {
  const b = $('#save'); b.disabled = true; b.textContent = T('saving');
  try {
    const iss = anyIssue(), ex = isExpert() && iss;
    const data = { mode: 'q', cycle, sampleId: ev.sampleId, name: me.name, dept: me.dept,
      causeIn: ex ? ev.causeIn : [], causeOut: ex ? ev.causeOut : [], solution: ex ? ev.solution.trim() : '', owners: ex ? ev.owners : [], photos: ev.photos.map(p => ({ data: p.data, thumb: p.thumb })),
      extra: cq.map(q => { const x = ev.xq[q.id]; return { id: q.id, team: q.team, g: q.g, q: q.g + ' · ' + q.text, st: x.st, score: x.score || '', tags: x.st === 'issue' ? x.tags : [], d: x.st === 'issue' ? x.d.trim() : '' }; }) };
    const r = await api.post('saveEval', data);
    if (!r.ok) throw new Error(r.error || '?');
    evals = evals.filter(e => !(e.sampleId === ev.sampleId && String(e.name).toLowerCase() === me.name.toLowerCase()));
    evals.push({ sampleId: ev.sampleId, name: me.name, at: r.at, gs: [...new Set(cq.map(q => q.g))] }); myEv = null;
    toast(T('saved')(ev.sampleId));
    view = 'list'; render(); scrollTo(0, 0);
  } catch (err) { toast(T('saveErr') + err.message); b.disabled = false; b.textContent = T('save'); }
}
// Tải dữ liệu của tháng đang xem (mặc định tháng đang chạy)
async function loadAll() {
  loadErr = '';
  const q = cycle ? '&cycle=' + cycle : '', c0 = PC.peek('samples' + q);
  if (c0 && c0.ok) { months = c0.months || []; current = c0.current || c0.cycle; cycle = c0.cycle; samples = c0.samples; evals = c0.evals;
    const cq0 = PC.peek('questions' + q), pl0 = PC.peek('plan' + q); cqAll = cq0 && cq0.ok ? cq0.questions : []; cq = cqFor(); plan = pl0 && pl0.ok ? pl0 : null; loaded = true; }
  else loaded = false;
  if (view !== 'score') render();
  try {
    const [r, qr, pl] = await Promise.all([api.get('samples' + q), api.get('questions' + q).catch(() => ({})), api.get('plan' + q).catch(() => ({}))]);
    if (!r.ok) throw new Error(r.error);
    months = r.months || []; current = r.current || r.cycle; cycle = r.cycle;
    samples = r.samples; evals = r.evals; cqAll = qr.ok ? qr.questions : []; cq = cqFor(); plan = pl.ok ? pl : null; loaded = true;
  } catch (err) { if (!loaded) loadErr = err.message; }
  if (view !== 'score') { const y = scrollY; render(); scrollTo(0, y); }
}
const shrinkImg = (src, max, q) => new Promise(res => { const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
  c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; im.onerror = () => res(''); im.src = src; });
$('#cam').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (!f || !ev) return; if (ev.photos.length >= 3) return toast(T('photoMax'));
  const fr = new FileReader(); fr.onload = async () => { const data = await shrinkImg(fr.result, 1280, .75), thumb = await shrinkImg(fr.result, 240, .6); if (data) { ev.photos.push({ data, thumb }); const y = scrollY; render(); scrollTo(0, y); } }; fr.readAsDataURL(f); };
(async () => {
  PC.bar($('#pcbar'), 'Đánh giá mẫu');
  cycle = PC.month();
  loadAll();
})();
</script>
