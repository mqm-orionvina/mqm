.miss { margin-top: 14px; } .miss h3 { margin: 0 0 6px; font-size: 14px; color: var(--muted); }

  const head = `<div class="card head"><div class="th" style="${s.thumb ? `background-image:url(${s.thumb})` : ''}"></div>
      <div><span class="id">${esc(s.id)}</span> ${originTag(s)}<b>${esc(s.brand)} · ${esc(s.flavor)}</b>
      <small>${s.sku ? esc(s.sku) + ' · ' : ''}${T('mfdShort')} ${dmy(s.mfd)} · ${T('buyShort')} ${dmy(s.buyDate)} · ${esc(L('market', s.market))}</small></div></div>`;
  if (!cq.length) return head + `<div class="card note">${esc(T('noQ')(PC.monthLabel(cycle)))}</div>`;
  let n = 0;
  return head + `${mine(s.id) ? `<div class="card note">${T('already')}</div>` : ''}
    <div class="stat"><span>${esc(T('qHint'))}</span><button class="linkbtn" id="allOk">${T('allOk')}</button></div>
    ${G.filter(g => cq.some(q => q.g === g)).map(g => `<div class="gtitle">${esc(gName(g))}</div>` + cq.filter(q => q.g === g).map(q => { const x = ev.xq[q.id]; n++;
      return `<div class="card attr ${x.st === 'issue' ? 'bad' : x.st === 'ok' ? 'fine' : ''}"><h3>${n}. ${esc(q.text)} <span>${esc(q.team)}</span></h3>
      ${q.c ? `<small class="cq-c">${T('cqWant')}${esc(q.c)}</small>` : ''}
      <div class="seg okis" data-xq="${esc(q.id)}"><button class="${x.st === 'ok' ? 'on ok' : ''}" data-v="ok">✓ ${T('ok')}</button><button class="${x.st === 'issue' ? 'on is' : ''}" data-v="issue">! ${T('issue')}</button></div>
      ${x.st ? `<div class="pick"><span class="label">${T('scoreL')}</span>${scale(q.id)}</div>` : ''}
      ${x.st === 'issue' ? `<span class="label" style="margin-top:12px">${T('pickIssue')}</span><div class="chips" data-t="${esc(q.id)}">${(GTAGS[g] || []).map(t => `<button class="chip sm ${x.tags.includes(t) ? 'on' : ''}" data-tag="${esc(t)}">${esc(L('tags', t))}</button>`).join('')}</div>
        <span class="label" style="margin-top:12px">${T('desc')}</span><textarea data-xd="${esc(q.id)}" placeholder="${esc(T('descPh'))}">${esc(x.d)}</textarea>` : ''}</div>`; }).join('')).join('')}
    ${anyIssue() && isExpert() ? `<div class="card attr cause"><h3>${T('causeTitle')} <span>${T('causeSub')}</span></h3>
      <span class="label">${T('causeIn')}</span>${pick('causeIn', CAUSE_IN, 'cause')}
      <span class="label" style="margin-top:12px">${T('causeOut')}</span>${pick('causeOut', CAUSE_OUT, 'cause')}
      <span class="label" style="margin-top:12px">${T('solution')}</span><textarea id="solution" placeholder="${esc(T('solutionPh'))}">${esc(ev.solution)}</textarea>
      <span class="label" style="margin-top:12px">${T('owners')}</span>${pick('owners', OWNERS, 'owner')}</div>` : ''}`;
}
function bar() {
  const b = $('#bar'), on = view === 'score' && me && cq.length;
  if (!on) { b.hidden = true; return; }
  const n = cq.filter(q => ev.xq[q.id].st).length, m = missing();
  b.hidden = false;
  b.innerHTML = `<div class="in"><div class="prog">${m.length ? esc(T('need') + m.join(', ')) : T('ready')}<div class="track"><i style="width:${n / cq.length * 100}%"></i></div></div><button class="btn" id="save" ${m.length ? 'disabled' : ''}>${T('save')}</button></div>`;
  $('#save').onclick = save;
}
function render() {
  $('#hero').innerHTML = hero();
  const wb = me && view !== 'score' ? `<div class="whobox"><div><small>${T('name')}</small><b>${esc(me.name)}</b><small>${esc(me.dept)} · ${me.brands === 'all' ? T('allBrands') : esc(T('nBrands')(me.brands.length))}</small></div><button class="logout" id="logout">${T('logout')}</button></div>` : '';
  $('#app').innerHTML = !me ? viewLogin() : wb + (view === 'score' ? viewScore() : view === 'brands' ? viewBrands() : viewList());
  bar(); bind();
}
function bindPicker() {
  const all = $('[data-all]'); if (all) all.onclick = () => { draft.brands = draft.brands === 'all' ? [] : 'all'; render(); };
  document.querySelectorAll('[data-group]').forEach(g => g.onclick = () => {
    const grp = (brandGroups().find(x => x[0] === g.dataset.group) || [, []])[1].map(x => x[0]);
    const cur = draft.brands === 'all' ? allBrands() : draft.brands;
    draft.brands = [...new Set(cur.concat(grp))];
    if (draft.brands.length === allBrands().length) draft.brands = 'all';
    render();
  });
  document.querySelectorAll('[data-brand]').forEach(c => c.onclick = () => {
    const b = c.dataset.brand, cur = draft.brands === 'all' ? allBrands() : draft.brands.slice();
    const i = cur.indexOf(b); i >= 0 ? cur.splice(i, 1) : cur.push(b);
    draft.brands = cur; render();
  });
}
function bind() {
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => {
    lang = b.dataset.lang; try { localStorage.setItem('mqm1a-lang', lang); } catch (e) {}
    const y = scrollY; render(); scrollTo(0, y);
  });
  // Đổi người phải Đăng xuất (bấm 2 lần); đăng xuất xong nhập lại từ đầu, không điền sẵn (anh Thái 09/11)
  const lo = $('#logout'); if (lo) lo.onclick = () => {
    if (!lo.classList.contains('arm')) { lo.classList.add('arm'); lo.textContent = T('logoutArm'); clearTimeout(lo._t); lo._t = setTimeout(() => { const b = $('#logout'); if (b) { b.classList.remove('arm'); b.textContent = T('logout'); } }, 3500); return; }
    draft = { name: '', dept: '', brands: [] }; view = 'list'; cur = null; ev = null; setMe(null); render(); scrollTo(0, 0); toast(T('loggedOut'));
  };
  const back = $('#back'); if (back) back.onclick = () => { view = 'list'; render(); scrollTo(0, 0); };
  if (!me) {
    const name = $('#name'); name.oninput = () => { draft.name = name.value; };
    document.querySelectorAll('#dept button').forEach(b => b.onclick = () => { draft.dept = b.dataset.v; render(); });
    bindPicker();
    $('#go').onclick = () => {
      const nm = draft.name.trim();
      if (!nm || !draft.dept) return toast(T('needName'));
      if (draft.brands !== 'all' && !draft.brands.length) return toast(T('needBrand'));
      setMe({ name: nm, dept: draft.dept, brands: draft.brands }); view = 'list'; render();
    };
    return;
  }
  if (view === 'brands') {
    bindPicker();
    $('#saveBrands').onclick = () => {
      if (draft.brands !== 'all' && !draft.brands.length) return toast(T('needBrand'));
      setMe({ ...me, brands: draft.brands }); view = 'list'; render(); scrollTo(0, 0);
    };
    return;
  }
  if (view === 'list') {
    const ms = $('#month'); if (ms) ms.onchange = () => { cycle = ms.value; PC.setMonth(cycle); loadAll(); };
    const q = $('#q'); if (q) q.oninput = () => { filt.q = q.value; const p = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); };
    document.querySelectorAll('[data-show]').forEach(b => b.onclick = () => { filt.show = b.dataset.show; render(); });
    document.querySelectorAll('.sample').forEach(b => b.onclick = () => open(b.dataset.id));
    const eb = $('#editBrands'); if (eb) eb.onclick = () => { draft.brands = me.brands; view = 'brands'; render(); scrollTo(0, 0); };
    return;
  }
  if (!cq.length) return;
  const keep = () => { const y = scrollY; render(); scrollTo(0, y); };
  // Điểm: bấm lại số đang chọn để bỏ
  document.querySelectorAll('.scale').forEach(sc => sc.querySelectorAll('button').forEach(b => b.onclick = () => {
    const x = ev.xq[sc.dataset.s], v = +b.dataset.v; x.score = x.score === v ? null : v; sc.querySelectorAll('button').forEach(y => y.classList.toggle('on', +y.dataset.v === x.score)); bar();
  }));
  const ao = $('#allOk'); if (ao) ao.onclick = () => { cq.forEach(q => { ev.xq[q.id].st = 'ok'; }); keep(); };
  document.querySelectorAll('[data-xq]').forEach(sg => sg.querySelectorAll('button').forEach(b => b.onclick = () => { ev.xq[sg.dataset.xq].st = b.dataset.v; keep(); }));
  document.querySelectorAll('[data-xd]').forEach(i => i.oninput = () => { ev.xq[i.dataset.xd].d = i.value; bar(); });
  // Lưu giá trị gốc của lỗi (data-tag), không lưu chữ đã dịch
  document.querySelectorAll('[data-t]').forEach(tg => tg.querySelectorAll('button').forEach(b => b.onclick = () => {
    const a = ev.xq[tg.dataset.t].tags, t = b.dataset.tag, i = a.indexOf(t); i >= 0 ? a.splice(i, 1) : a.push(t); b.classList.toggle('on', i < 0); bar();
  }));
  document.querySelectorAll('[data-pick]').forEach(pg => pg.querySelectorAll('button').forEach(b => b.onclick = () => {
    const a = ev[pg.dataset.pick], x = b.dataset.x, i = a.indexOf(x); i >= 0 ? a.splice(i, 1) : a.push(x); b.classList.toggle('on', i < 0); bar();
  }));
  const so = $('#solution'); if (so) so.oninput = () => { ev.solution = so.value; bar(); };
}
function open(id) {
  cur = samples.find(s => s.id === id); if (!cur) return;
  ev = { sampleId: id, causeIn: [], causeOut: [], solution: '', owners: [], xq: Object.fromEntries(cq.map(q => [q.id, { st: '', d: '', score: null, tags: [] }])) };
  view = 'score'; render(); scrollTo(0, 0);
}
async function save() {
  const b = $('#save'); b.disabled = true; b.textContent = T('saving');
  try {
    const iss = anyIssue(), ex = isExpert() && iss;
    const data = { mode: 'q', cycle, sampleId: ev.sampleId, name: me.name, dept: me.dept,
      causeIn: ex ? ev.causeIn : [], causeOut: ex ? ev.causeOut : [], solution: ex ? ev.solution.trim() : '', owners: ex ? ev.owners : [],
      extra: cq.map(q => { const x = ev.xq[q.id]; return { id: q.id, team: q.team, g: q.g, q: q.g + ' · ' + q.text, st: x.st, score: x.score || '', tags: x.st === 'issue' ? x.tags : [], d: x.st === 'issue' ? x.d.trim() : '' }; }) };
    const r = await api.post('saveEval', data);
    if (!r.ok) throw new Error(r.error || '?');
    evals = evals.filter(e => !(e.sampleId === ev.sampleId && String(e.name).toLowerCase() === me.name.toLowerCase()));
    evals.push({ sampleId: ev.sampleId, name: me.name, at: r.at });
    toast(T('saved')(ev.sampleId));
    view = 'list'; render(); scrollTo(0, 0);
  } catch (err) { toast(T('saveErr') + err.message); b.disabled = false; b.textContent = T('save'); }
}
// Tải dữ liệu của tháng đang xem (mặc định tháng đang chạy)
async function loadAll() {
  loaded = false; loadErr = ''; render();
  try {
    const q = cycle ? '&cycle=' + cycle : '';
    const [r, qr, pl] = await Promise.all([api.get('samples' + q), api.get('questions' + q).catch(() => ({})), api.get('plan' + q).catch(() => ({}))]);
    if (!r.ok) throw new Error(r.error);
    months = r.months || []; current = r.current || r.cycle; cycle = r.cycle;
    samples = r.samples; evals = r.evals; cqAll = qr.ok ? qr.questions : []; cq = cqFor(); plan = pl.ok ? pl : null; loaded = true;
  } catch (err) { loadErr = err.message; }
  render();
}
(async () => {
  PC.bar($('#pcbar'), 'Đánh giá mẫu');
  cycle = PC.month();
  loadAll();
})();
</script>
</body>
</html>
