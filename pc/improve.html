  return `<div class="item ${st === STATUS[2] ? 'done' : lt ? 'late' : ''}" data-aid="${esc(it.aid)}">
    <div class="pc-h"><div><b class="pc-sku">${esc(it.sku || it.sampleId)}</b>
        <div class="pc-meta"><span>Mẫu <b>${esc(it.sampleId)}</b></span><span>Bộ phận đánh giá <b>${esc(it.from || '—')}</b></span><span>Bộ phận xử lý <b>${esc(it.who)}</b></span><span>Hạn <b>${dmy(it.when)}</b></span></div></div>
      <div class="pc-st"><span class="pill s${si}">${esc(st)}</span>${lt ? ' <span class="pill late">Quá hạn</span>' : ''}<small>${esc(it.aid)}</small></div></div>
    ${issueTable(it)}
    <div class="pc-two">${it.cause ? `<div class="pc-box"><span>Nguyên nhân nghi ngờ</span><p>${esc(it.cause)}</p></div>` : ''}${it.suggest ? `<div class="pc-box"><span>Giải pháp tạm thời đề xuất</span><p>${esc(it.suggest)}</p></div>` : ''}</div>
    ${(it.photos || []).length ? `<div class="pc-ph"><span class="lb">ẢNH MINH HOẠ</span>${photoH(it)}</div>` : ''}
    <div class="form"><h4>Kết quả cải tiến</h4>
      <div class="seg" data-st="${esc(it.aid)}">${STATUS.map((s, i) => `<button class="s${i} ${s === st ? 'on' : ''}" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>
      <div class="f2"><div><span class="lb">NGUYÊN NHÂN GỐC (ĐÃ XÁC ĐỊNH)</span><textarea data-f="rootFix" data-a="${esc(it.aid)}" placeholder="VD: lực seal máy đóng gói line 3 thấp hơn tiêu chuẩn">${esc(v.rootFix)}</textarea></div>
        <div><span class="lb">HÀNH ĐỘNG KHẮC PHỤC ĐÃ LÀM ${st === STATUS[2] ? '*' : ''}</span><textarea data-f="plan" data-a="${esc(it.aid)}" placeholder="VD: chỉnh nhiệt độ seal, kiểm 100% lô 10/2026">${esc(v.plan)}</textarea></div>
        <div><span class="lb">BIỆN PHÁP PHÒNG NGỪA TÁI DIỄN</span><textarea data-f="prevent" data-a="${esc(it.aid)}" placeholder="VD: thêm bước kiểm lực seal đầu ca vào checklist QA">${esc(v.prevent)}</textarea></div>
        <div><span class="lb">NGƯỜI PHỤ TRÁCH</span><input class="in" data-f="owner" data-a="${esc(it.aid)}" value="${esc(v.owner)}" placeholder="Họ tên · bộ phận">
          <span class="lb">NGÀY HOÀN THÀNH (DỰ KIẾN / THỰC TẾ)</span><input class="in" type="date" data-f="doneDate" data-a="${esc(it.aid)}" value="${esc(v.doneDate)}"></div></div>
      <span class="lb">EVIDENCE (ẢNH / PDF)</span>
      <div class="ev">${ev.map(f => `<div class="f" style="${f.t ? `background-image:url(${f.t})` : ''}" title="${esc(f.n)}">${f.t ? '' : esc(f.n)}<button data-rm="${esc(f.id)}" aria-label="Bỏ">×</button></div>`).join('')}
        ${(e ? e.files : []).map((f, i) => `<div class="f new" style="${f.thumb ? `background-image:url(${f.thumb})` : ''}">${f.thumb ? '' : esc(f.name)}<button data-rmn="${i}" aria-label="Bỏ">×</button></div>`).join('')}
        <label class="add">+ Thêm<br>ảnh / PDF<input type="file" accept="image/*,application/pdf" multiple hidden data-file="${esc(it.aid)}"></label></div>
      <div class="row"><small>${it.updatedAt && it.by ? `Cập nhật ${esc(fmtAt(it.updatedAt))} · ${esc(it.by)}` : ''}</small><button class="btn dark" data-save="${esc(it.aid)}" ${e ? '' : 'disabled'}>💾 Lưu kết quả cải tiến</button></div></div></div>`;
}
function progTab() {
  if (A.locked) return `<div class="empty">Tiến độ cải thiện chỉ hiện cho bộ phận được giao: mở link trong mail gửi bộ phận bạn. FQS / Host / quản lý: đăng nhập để xem tất cả.<br><br><button class="btn" id="login">Đăng nhập</button></div>`;
  const all = A.items, depts = [...new Set(all.map(x => x.who))].sort();
  const pool = all.filter(x => !fDept || x.who === fDept), xs = pool.filter(x => fSt === 'all' || (fSt === 'late' ? late(x) : x.status === fSt));
  const n = s => pool.filter(x => x.status === s).length;
  return `${keyDept ? `<div class="note key"><span>Bộ phận <b>${esc(keyDept)}</b>: đây là các việc cần xử lý của bộ phận bạn. Cập nhật trạng thái, ghi kết quả cải tiến, đính kèm evidence rồi bấm Lưu.</span></div>` : ''}
    ${keyDept ? '' : `<div class="filters"><button class="chip ${!fDept ? 'on' : ''}" data-d="">Mọi bộ phận<small>${all.length}</small></button>${depts.map(d => `<button class="chip ${fDept === d ? 'on' : ''}" data-d="${esc(d)}">${esc(d)}<small>${all.filter(x => x.who === d).length}</small></button>`).join('')}</div>`}
    <div class="kpis"><div class="kpi"><small>Việc cần xử lý</small><b>${pool.length}</b></div><div class="kpi red"><small>${STATUS[0]}</small><b>${n(STATUS[0])}</b></div>
      <div class="kpi"><small>${STATUS[1]}</small><b>${n(STATUS[1])}</b></div><div class="kpi"><small>${STATUS[2]}</small><b>${n(STATUS[2])}</b></div><div class="kpi red"><small>Quá hạn</small><b>${pool.filter(late).length}</b></div></div>
    <div class="filters">${[['all', 'Tất cả'], [STATUS[0], STATUS[0]], [STATUS[1], STATUS[1]], [STATUS[2], STATUS[2]], ['late', 'Quá hạn']].map(([v, t]) => `<button class="chip ${fSt === v ? 'on' : ''}" data-s="${esc(v)}">${t}</button>`).join('')}</div>
    ${xs.length ? xs.map(progCard).join('') : `<div class="empty">${all.length ? 'Không có việc nào theo lựa chọn này.' : 'Chưa có việc nào. Việc hiện ở đây ngay khi FQS bấm "Đồng ý" ở Danh sách cải thiện.'}</div>`}`;
}
function render() {
  const showLists = !keyDept;
  if (!showLists) stab = 'prog';
  const tabs = showLists ? `<div class="stabs"><button class="${stab === 'list' ? 'on' : ''}" data-tab="list">1 · Danh sách cải thiện${I ? `<small>${new Set(I.candidates.map(x => x.sampleId)).size}</small>` : ''}</button>
    <button class="${stab === 'conf' ? 'on' : ''}" data-tab="conf">2 · Đã xác nhận${I ? `<small>${new Set(I.confirmed.map(x => x.sampleId)).size}</small>` : ''}</button><button class="${stab === 'prog' ? 'on' : ''}" data-tab="prog">3 · Tiến độ cải thiện</button></div>` : '';
  let body;
  if (stab === 'prog') body = A ? progTab() : '<div class="empty">Đang tải…</div>';
  else if (!canImp()) body = `<div class="empty">Danh sách cải thiện dành cho FQS / Host / quản lý. Đăng nhập để xem, xác nhận và gửi mail.<br><br><button class="btn" id="login">Đăng nhập</button></div>`;
  else if (!I) body = Ierr ? `<div class="empty">Không tải được danh sách: ${esc(Ierr)}<br><br><button class="btn" id="login">Đăng nhập lại</button></div>` : '<div class="empty">Đang tải…</div>';
  else body = stab === 'list' ? listTab() : confTab();
  $('#app').innerHTML = `${showLists ? `<div class="filters">${PC.monthSelect(months, cycle)}</div>` : ''}${tabs}${body}`;
  bind();
}
const keep = () => { const y = scrollY; render(); scrollTo(0, y); };
function bind() {
  fillThumbs();
  const ms = $('#month'); if (ms) ms.onchange = () => { cycle = ms.value; PC.setMonth(cycle); load(); };
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { stab = b.dataset.tab; try { sessionStorage.setItem('mqmImpTab', stab); } catch (e) {} render(); });
  const lg = $('#login'); if (lg) lg.onclick = async () => { PC.logout(); const u = await PC.login('Đăng nhập · Cải thiện'); if (u && !IMP.includes(u.role)) toast('Tài khoản này không có quyền ở mục Cải thiện.'); 
PC.bar($('#pcbar'), 'Cải thiện'); load(); };
  // sub-tab 1
  // bộ phận xử lý: × bỏ, (+) thêm (11/11)
  const ownOf = k => (ownEdit[k] || GK[k].owners).slice();
  const each = async (k, body) => { let r; for (const iid of GK[k].iids) { r = await PC.post(body.api, Object.assign({ cycle: I.cycle, iid }, body.d)); if (!r.ok) throw new Error(r.error); } return r; };
  document.querySelectorAll('[data-own] [data-rmo]').forEach(b => b.onclick = () => { const iid = b.closest('[data-own]').dataset.own; ownEdit[iid] = ownOf(iid).filter(o => o !== b.dataset.rmo); keep(); });
  document.querySelectorAll('select[data-addo]').forEach(sel => sel.onchange = () => { if (!sel.value) return; const iid = sel.dataset.addo, cur = ownOf(iid); if (!cur.includes(sel.value)) cur.push(sel.value); ownEdit[iid] = cur; keep(); });
  document.querySelectorAll('[data-conf]').forEach(b => b.onclick = async () => {
    const k = b.dataset.conf; b.disabled = true; b.textContent = 'Đang xác nhận…';
    try { const r = await each(k, { api: 'issueConfirm', d: { owners: ownEdit[k] || GK[k].owners } }); I = r; delete ownEdit[k]; toast('Đã đồng ý · chuyển sang "Đã xác nhận"'); keep(); }
    catch (e) { toast('Chưa xác nhận được: ' + e.message); b.disabled = false; b.textContent = 'Đồng ý'; } });
  document.querySelectorAll('[data-rej]').forEach(b => b.onclick = async () => { b.disabled = true; b.textContent = 'Đang lưu…';
    try { const r = await each(b.dataset.rej, { api: 'issueConfirm', d: { reject: true } }); I = r; toast('Đã ghi Không đồng ý'); keep(); }
    catch (e) { toast('Chưa lưu được: ' + e.message); b.disabled = false; b.textContent = 'Không đồng ý'; } });
  // sub-tab 2
  document.querySelectorAll('[data-unc]').forEach(b => b.onclick = async () => { b.disabled = true;
    try { const r = await each(b.dataset.unc, { api: 'issueUnconfirm', d: {} }); I = r; toast('Đã đưa về danh sách chờ duyệt'); keep(); }
    catch (e) { toast('Chưa đưa về được: ' + e.message); b.disabled = false; } });
  const ml = $('#mail'); if (ml) ml.onclick = mailFlow;
  const xl = $('#xls'); if (xl) xl.onclick = confXls;
  // sub-tab 3
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { fDept = b.dataset.d; render(); });
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { fSt = b.dataset.s; render(); });
  document.querySelectorAll('[data-st]').forEach(sg => sg.querySelectorAll('button').forEach(b => b.onclick = () => { touch(sg.dataset.st).status = b.dataset.v; keep(); }));
  document.querySelectorAll('[data-f]').forEach(t => { const on = () => { touch(t.dataset.a)[t.dataset.f] = t.value; const s = document.querySelector(`[data-save="${t.dataset.a}"]`); if (s) s.disabled = false; }; t.oninput = on; t.onchange = on; });
  document.querySelectorAll('[data-file]').forEach(inp => inp.onchange = async () => {
    const e = touch(inp.dataset.file);
    for (const f of [...inp.files].slice(0, 5)) { try { e.files.push(await prep(f)); } catch (x) { toast(x.message); } }
    keep();
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const aid = b.closest('.item').dataset.aid; touch(aid).remove.push(b.dataset.rm); keep(); });
  document.querySelectorAll('[data-rmn]').forEach(b => b.onclick = () => { const aid = b.closest('.item').dataset.aid; touch(aid).files.splice(+b.dataset.rmn, 1); keep(); });
  document.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const aid = b.dataset.save, e = edits[aid]; if (!e) return;
    if (e.status === STATUS[2] && !String(e.plan || '').trim()) return toast('Đã xử lý thì cần ghi hành động khắc phục đã làm.');
    b.disabled = true; b.textContent = e.files.length ? 'Đang tải evidence…' : 'Đang lưu…';
    try {
      const r = await PC.post('actionUpdate', Object.assign({ cycle: A.cycle, aid, k: keyDept ? LINK.k : '' }, e));
      if (!r.ok) throw new Error(r.error);
      A.items = A.items.map(x => x.aid === aid ? r.item : x); delete edits[aid]; toast('Đã lưu kết quả cải tiến ' + aid); keep();
    } catch (x) { b.disabled = false; b.textContent = '💾 Lưu kết quả cải tiến'; toast('Chưa lưu được: ' + x.message); }
  });
}
// 11/11: hiện ngay bản lần trước trên máy này, rồi cập nhật ngầm
const ckey = (q, kq) => 'impc:' + (PC.user() || {}).user + '|' + q + kq;
function apply(a, i) {
  A = a; cycle = a.cycle; months = a.months || []; keyDept = a.dept || '';
  I = i && i.ok ? i : null; Ierr = i && !i.ok ? (i.error || 'lỗi không rõ') : '';
  $('#sub').textContent = keyDept ? `${PC.monthLabel(a.cycle)} · việc cần xử lý của bộ phận ${keyDept}. Cập nhật trạng thái và kết quả cải tiến, kèm evidence.`
    : `${PC.monthLabel(a.cycle)} · Danh sách vấn đề từ Đánh giá mẫu → FQS xác nhận → gửi mail bộ phận → bộ phận cập nhật tiến độ và kết quả cải tiến.`;
}
async function load() {
  const q = (cycle ? '&cycle=' + encodeURIComponent(cycle) : '');
  const kq = LINK.d && LINK.k && (!LINK.c || LINK.c === cycle || !cycle) ? '&d=' + encodeURIComponent(LINK.d) + '&k=' + encodeURIComponent(LINK.k) : '';
  let shown = false;
  try { const c = JSON.parse(localStorage.getItem(ckey(q, kq)) || 'null'); if (c && c.a && c.a.ok) { apply(c.a, c.i); render(); shown = true; } } catch (e) {}
  if (!shown) $('#app').innerHTML = '<div class="empty">Đang tải…</div>';
  try {
    const tq = canImp() ? '&t=' + encodeURIComponent(PC.token()) : '';
    const [a, i] = await Promise.all([PC.get('actions' + q + kq + tq), canImp() && !kq ? PC.get('issues' + q + tq) : Promise.resolve(null)]);
    if (!a.ok) throw new Error(a.error);
    try { localStorage.setItem(ckey(q, kq), JSON.stringify({ a, i: i && i.ok ? i : null })); } catch (e) {}
    if (shown && (Object.keys(edits).length || Object.keys(ownEdit).length)) { A = a; if (i && i.ok) I = i; return; }   // đang sửa thì không vẽ lại
    apply(a, i); const y = scrollY; render(); scrollTo(0, y);
  } catch (x) { if (shown) { toast('Chưa cập nhật được: ' + x.message); return; } $('#app').innerHTML = `<div class="empty">Không tải được (${esc(x.message)}). Kiểm tra mạng rồi tải lại trang.</div>`; }
}
// 11/11: bấm ảnh → xem ngay trên trang (không mở tab mới); ảnh lớn lấy từ Drive, không xem được thì phóng to ảnh nhỏ
function lightbox(id, t) {
  let lb = document.getElementById('lb'); if (!lb) { lb = document.createElement('div'); lb.id = 'lb'; document.body.appendChild(lb); }
  lb.innerHTML = `<button class="lbx" aria-label="Đóng">×</button><img alt="Ảnh"><p class="lbn"><a href="${driveUrl(id)}" target="_blank" rel="noopener">Mở bản gốc trên Drive ↗</a></p>`;
  // 13/11: ảnh lớn lấy qua Apps Script; trong lúc tải hiện ảnh nhỏ phóng to
  const img = lb.querySelector('img'), fail = () => img.replaceWith(Object.assign(document.createElement('p'), { className: 'lbmsg', textContent: 'Không xem được ảnh trên trang. Bấm "Mở bản gốc trên Drive".' }));
  if (t) { img.src = t; img.classList.add('small'); }
  fetch(`${PC_API}?api=photo&id=${encodeURIComponent(id)}`, { credentials: 'omit' }).then(r => r.json())
    .then(d => { if (d && d.ok && d.data) { img.onerror = () => { if (!t) fail(); }; img.src = d.data; img.classList.remove('small'); } else if (!t) fail(); }).catch(() => { if (!t) fail(); });
  lb.hidden = false; document.body.style.overflow = 'hidden';
  const close = () => { lb.hidden = true; lb.innerHTML = ''; document.body.style.overflow = ''; };
  lb.onclick = e => { if (e.target === lb || e.target.classList.contains('lbx')) close(); };
  document.addEventListener('keydown', function esc_(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc_); } });
}
document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[data-pid]'); if (!a) return; e.preventDefault(); lightbox(a.dataset.pid, a.dataset.t); });
PC.bar($('#pcbar'), 'Cải thiện');
load();
</script>
