<script>
// Tab Cải thiện (anh Thái 10/11/2026) · 3 sub-tab:
// 1 Danh sách cải thiện: mọi lượt chấm có vấn đề (mẫu, vấn đề, bộ phận đánh giá, nguyên nhân, ảnh, bộ phận nên xử lý — sửa được) → FQS bấm Xác nhận

// Sub-tab 1, 2 và xem mọi tiến độ: đăng nhập FQS / Host / quản lý.

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dmy = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
const fmtAt = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }); };
const toast = t => { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => { el.hidden = true; }, 4500); };
const url = new URLSearchParams(location.search);
const LINK = { c: url.get('c') || '', d: url.get('d') || '', k: url.get('k') || '' };
(() => { if (!LINK.k) { try { const x = JSON.parse(sessionStorage.getItem('mqmImproveKey') || 'null'); if (x) Object.assign(LINK, x); } catch (e) {} return; }
  try { sessionStorage.setItem('mqmImproveKey', JSON.stringify(LINK)); } catch (e) {} history.replaceState(null, '', location.pathname + (LINK.c ? '?c=' + encodeURIComponent(LINK.c) : '')); })();
const IMP = ['FQS', 'HOST', 'ADMIN', 'ALL'];
const canImp = () => { const u = PC.user(); return !!u && IMP.includes(u.role); };
// 16/11: tài khoản chỉ xem (PC.IMP_VIEWERS, vd rd-snack): thấy cả 3 tab con, mọi nút xác nhận / gửi mail / lưu đều ẩn

const ro = () => !canImp() && PC.impViewer();
let stab = url.get('tab') === 'prog' || LINK.k ? 'prog' : (() => { try { return sessionStorage.getItem('mqmImpTab') || 'list'; } catch (e) { return 'list'; } })();
let Ierr = '', cycle = LINK.c || PC.month(), I = null, A = null, months = [], keyDept = '', fDept = LINK.d || '', fSt = 'all', busy = false;
const ownEdit = {};   // iid → owners đang sửa ở sub-tab 1
const edits = {};     // aid → form kết quả cải tiến đang sửa
const today = new Date().toISOString().slice(0, 10);
const late = it => it.status !== STATUS[2] && it.when && it.when < today;
const driveUrl = id => `https://drive.google.com/file/d/${encodeURIComponent(id)}/view`;
const photos = ps => (ps || []).length ? `<div class="ph">${ps.map(p => `<a href="${driveUrl(p.id)}" data-pid="${esc(p.id)}" data-t="${esc(p.t || '')}" style="${p.t ? `background-image:url(${p.t})` : ''}" title="Xem ảnh"></a>`).join('')}</div>` : '<span class="meta">Không có ảnh</span>';
const whatList = w => (w || []).length ? `<ol class="wl">${w.map(x => `<li><span class="g">${esc(x.g)}</span>${esc(x.q)}${x.tags.length ? ` · <span class="tg">${esc(x.tags.join(', '))}</span>` : ''}${x.note ? ` · <span class="nt">${esc(x.note)}</span>` : ''}</li>`).join('')}</ol>` : '';

// Ảnh / PDF evidence
const readAs = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
const shrink = (src, max, q) => new Promise(ok => { const im = new Image(); im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
  c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', q)); }; im.onerror = () => ok(''); im.src = src; });
async function prep(f) {
  if (f.type === 'application/pdf') { if (f.size > 8e6) throw new Error(f.name + ' lớn hơn 8 MB'); return { name: f.name, data: await readAs(f), thumb: '' }; }
  if (!/^image\//.test(f.type)) throw new Error(f.name + ': chỉ nhận ảnh hoặc PDF');

// ---------- Sub-tab 1: Danh sách cải thiện ----------
function issueHead(x) {
  return `<div class="top"><b>${esc(x.sku || x.sampleId)}</b><span>Mẫu ${esc(x.sampleId)}${x.origin && x.origin !== 'ORION' ? ' · đối thủ' : ''}${x.mfd ? ' · NSX ' + dmy(x.mfd) : ''} · Bộ phận đánh giá: <b style="color:#111">${esc(x.from)}</b></span></div>`;
}

      <span class="lb">NGUYÊN NHÂN NGHI NGỜ</span><div class="meta"><i>${esc((x.cause || []).join(', ') || '—')}</i></div>
      ${x.solution ? `<span class="lb">GIẢI PHÁP TẠM THỜI</span><div class="meta"><i>${esc(x.solution)}</i></div>` : ''}</div>
    <div><span class="lb">ẢNH MINH HOẠ</span>${photos(x.photos)}</div></div>`;
}
  // 11/11: Brand / Flavor / Size dưới mã mẫu, mỗi cái 1 dòng
const skuLines = x => `<span class="skul">${String(x.sku || '').split(' · ').filter(Boolean).map(t => `<span>${esc(t)}</span>`).join('')}</span>`;
const sumG = x => [...new Set((x.what || []).map(w => w.g))].join(', ');
  // 11/11: dễ đọc — mỗi câu 1 dòng, vấn đề là nhãn đỏ, ghi chú in nghiêng; nguyên nhân / giải pháp có tiêu đề riêng
  // 11/11 v2: bảng nhỏ Câu hỏi | Vấn đề | Ghi chú, chữ mảnh, gom theo nhóm
const descH = x => { const ws = x.what || [], multi = new Set(ws.map(w => w.g)).size > 1; let g0 = null;
  return `<table class="iq"><thead><tr><th>Câu hỏi</th><th>Vấn đề</th><th>Ghi chú</th></tr></thead><tbody>${ws.map(w => { const gh = multi && w.g !== g0 ? `<tr class="gh"><td colspan="3">${esc(w.g)}</td></tr>` : ''; g0 = w.g;
    return `${gh}<tr><td class="q">${esc(w.q.replace(/\?$/, ''))}</td><td class="p">${esc((w.tags || []).join(', ') || '—')}</td><td class="n">${esc(w.note || '')}</td></tr>`; }).join('')}</tbody></table>`; };
const causeH = x => `${(x.cause || []).length || x.solution ? `<div class="cs2">${(x.cause || []).length ? `<div><span>Nguyên nhân nghi ngờ</span><p>${esc(x.cause.join(', '))}</p></div>` : ''}${x.solution ? `<div><span>Giải pháp tạm thời</span><p>${esc(x.solution)}</p></div>` : ''}</div>` : ''}`;
  // 11/11: ảnh hiện ra luôn ngay sau phần vấn đề (ảnh nhỏ có sẵn, không có thì ảnh thu nhỏ từ Drive); bấm để xem to
const photoH = x => (x.photos || []).length ? `<div class="phrow">${x.photos.map(p => { const t = p.t || TH[p.id] || ''; return `<a href="${driveUrl(p.id)}" data-pid="${esc(p.id)}" data-t="${esc(t)}" class="${t ? '' : TH[p.id] === '' ? 'noimg' : 'ld'}"><img ${t ? `src="${t}"` : ''} alt="Ảnh minh chứng" loading="lazy" onerror="this.parentNode.classList.add('noimg')"></a>`; }).join('')}</div>` : '';
// 13/11: ảnh chưa có bản nhỏ trong Sheet → tải ảnh qua Apps Script (ảnh trên Drive không công khai), thu nhỏ trên máy
// rồi nhớ trong máy (localStorage mqm-th:<id>) → lần sau hiện ngay. Tải tối đa 3 ảnh cùng lúc.
const TH = {}, thBusy = {}, thQ = [];
let thRun = 0;
try { Object.keys(localStorage).filter(k => k.startsWith('mqm-th:')).forEach(k => { TH[k.slice(7)] = localStorage.getItem(k); }); } catch (e) {}
function setThumb(a, u) { a.dataset.t = u; a.classList.remove('ld', 'noimg'); const im = a.querySelector('img'); if (im) im.src = u; else a.style.backgroundImage = `url(${u})`; }
const shrinkTo = (src, max) => new Promise(ok => { const im = new Image(); im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
  c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', .7)); }; im.onerror = () => ok(''); im.src = src; });
function paintThumbs() {
  document.querySelectorAll('[data-pid]').forEach(a => { if (a.dataset.t) return; const u = TH[a.dataset.pid];
    if (u) setThumb(a, u); else if (u === '') { a.classList.remove('ld'); a.classList.add('noimg'); } });
}
function pumpThumbs() {
  while (thRun < 3 && thQ.length) {
    const id = thQ.shift(); thRun++;
    fetch(`${PC_API}?api=photo&id=${encodeURIComponent(id)}`, { credentials: 'omit' }).then(r => r.json())
      .then(d => d && d.ok && d.data ? shrinkTo(d.data, 360) : '').catch(() => '')
      .then(u => { TH[id] = u || ''; if (u) { try { localStorage.setItem('mqm-th:' + id, u); } catch (e) {} } })
      .finally(() => { delete thBusy[id]; thRun--; paintThumbs(); pumpThumbs(); });
  }
}
function fillThumbs() {
  paintThumbs();
  [...document.querySelectorAll('[data-pid]')].filter(a => !a.dataset.t).map(a => a.dataset.pid)
    .forEach(id => { if (TH[id] === undefined && !thBusy[id]) { thBusy[id] = 1; thQ.push(id); } });
  pumpThumbs();
}
// 11/11: gom các lượt chấm cùng 1 mẫu (mọi bộ phận đánh giá) thành 1 dòng; nút bấm áp dụng cho tất cả lượt trong nhóm
const GK = {};
const uq = a => [...new Set(a.filter(Boolean))];
function grp(list, byMail) {
  const m = new Map(), GO = PC.GROUPS || [];
  list.forEach(x => { const k = x.sampleId + (byMail ? (x.mailedAt ? '|m' : '|n') : ''); if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
  return [...m].map(([k, xs]) => { const W = new Map();
    xs.forEach(x => (x.what || []).forEach(w => { const wk = w.g + '|' + w.q; if (!W.has(wk)) W.set(wk, { g: w.g, q: w.q, tags: [], note: '' }); const o = W.get(wk);
      o.tags = uq(o.tags.concat(w.tags || [])); if (w.note) o.note = uq(o.note.split(' · ').concat(w.note)).join(' · '); }));
    const froms = uq(xs.map(x => x.from));
    const g = Object.assign({}, xs[0], { key: k, iids: xs.map(x => x.iid), n: xs.length, froms, from: froms.join(', '),
      what: [...W.values()].map((w, i) => [w, i]).sort((a, b) => GO.indexOf(a[0].g) - GO.indexOf(b[0].g) || a[1] - b[1]).map(z => z[0]),
      cause: uq(xs.flatMap(x => x.cause || [])), solution: uq(xs.map(x => x.solution)).join(' · '), owners: uq(xs.flatMap(x => x.owners || [])),
      photos: xs.flatMap(x => x.photos || []), by: uq(xs.map(x => x.by)).join(', '), at: xs.map(x => x.at).sort()[0], mailedAt: xs.map(x => x.mailedAt).filter(Boolean).sort().pop() || '' });
    GK[k] = g; return g; });
}
const dtags = x => (x.froms || [x.from]).map(d => `<span class="dtag">${esc(d)}</span>`).join('');
const nEv = x => x.n > 1 ? `<small class="nev">${x.n} lượt chấm</small>` : '';
function listTab() {

    for (const f of [...inp.files].slice(0, 5)) { try { e.files.push(await prep(f)); } catch (x) { toast(x.message); } }
    keep();
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const aid = b.closest('.item').dataset.aid; touch(aid).remove.push(b.dataset.rm); keep(); });
  document.querySelectorAll('[data-rmn]').forEach(b => b.onclick = () => { const aid = b.closest('.item').dataset.aid; touch(aid).files.splice(+b.dataset.rmn, 1); keep(); });
  document.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const aid = b.dataset.save, e = edits[aid]; if (!e) return;
    if (e.status === STATUS[2] && !String(e.plan || '').trim()) return toast('Đã xử lý thì cần ghi hành động khắc phục đã làm.');
    b.disabled = true; b.textContent = e.files.length ? 'Đang tải evidence…' : 'Đang lưu…';
    try {
      const r = await PC.post('actionUpdate', Object.assign({ cycle: A.cycle, aid, k: keyDept ? LINK.k : '' }, e));
      if (!r.ok) throw new Error(r.error);
      A.items = A.items.map(x => x.aid === aid ? r.item : x); delete edits[aid]; toast('Đã lưu kết quả cải tiến ' + aid); keep();
    } catch (x) { b.disabled = false; b.textContent = '💾 Lưu kết quả cải tiến'; toast('Chưa lưu được: ' + x.message); }
  });
}
// 11/11: hiện ngay bản lần trước trên máy này, rồi cập nhật ngầm
const ckey = (q, kq) => 'impc:' + (PC.user() || {}).user + '|' + q + kq;
function apply(a, i) {
  A = a; cycle = a.cycle; months = a.months || []; keyDept = a.dept || '';
  I = i && i.ok ? i : null; Ierr = i && !i.ok ? (i.error || 'lỗi không rõ') : '';
  $('#sub').textContent = keyDept ? `${PC.monthLabel(a.cycle)} · việc cần xử lý của bộ phận ${keyDept}. Cập nhật trạng thái và kết quả cải tiến, kèm evidence.`
    : `${PC.monthLabel(a.cycle)} · Danh sách vấn đề từ Đánh giá mẫu → FQS xác nhận → gửi mail bộ phận → bộ phận cập nhật tiến độ và kết quả cải tiến.`;
}
async function load() {
  const q = (cycle ? '&cycle=' + encodeURIComponent(cycle) : '');
  const kq = LINK.d && LINK.k && (!LINK.c || LINK.c === cycle || !cycle) ? '&d=' + encodeURIComponent(LINK.d) + '&k=' + encodeURIComponent(LINK.k) : '';
  let shown = false;
  try { const c = JSON.parse(localStorage.getItem(ckey(q, kq)) || 'null'); if (c && c.a && c.a.ok) { apply(c.a, c.i); render(); shown = true; } } catch (e) {}
  if (!shown) $('#app').innerHTML = '<div class="empty">Đang tải…</div>';
  try {
    const tq = canView() ? '&t=' + encodeURIComponent(PC.token()) : '';
    const [a, i] = await Promise.all([PC.get('actions' + q + kq + tq), canView() && !kq ? PC.get('issues' + q + tq) : Promise.resolve(null)]);
    if (!a.ok) throw new Error(a.error);
    try { localStorage.setItem(ckey(q, kq), JSON.stringify({ a, i: i && i.ok ? i : null })); } catch (e) {}
    if (shown && (Object.keys(edits).length || Object.keys(ownEdit).length)) { A = a; if (i && i.ok) I = i; return; }   // đang sửa thì không vẽ lại
    apply(a, i); const y = scrollY; render(); scrollTo(0, y);
  } catch (x) { if (shown) { toast('Chưa cập nhật được: ' + x.message); return; } $('#app').innerHTML = `<div class="empty">Không tải được (${esc(x.message)}). Kiểm tra mạng rồi tải lại trang.</div>`; }
}
// 11/11: bấm ảnh → xem ngay trên trang (không mở tab mới); ảnh lớn lấy từ Drive, không xem được thì phóng to ảnh nhỏ
function lightbox(id, t) {
  let lb = document.getElementById('lb'); if (!lb) { lb = document.createElement('div'); lb.id = 'lb'; document.body.appendChild(lb); }
  lb.innerHTML = `<button class="lbx" aria-label="Đóng">×</button><img alt="Ảnh"><p class="lbn"><a href="${driveUrl(id)}" target="_blank" rel="noopener">Mở bản gốc trên Drive ↗</a></p>`;
  // 13/11: ảnh lớn lấy qua Apps Script; trong lúc tải hiện ảnh nhỏ phóng to
  const img = lb.querySelector('img'), fail = () => img.replaceWith(Object.assign(document.createElement('p'), { className: 'lbmsg', textContent: 'Không xem được ảnh trên trang. Bấm "Mở bản gốc trên Drive".' }));
  if (t) { img.src = t; img.classList.add('small'); }
  fetch(`${PC_API}?api=photo&id=${encodeURIComponent(id)}`, { credentials: 'omit' }).then(r => r.json())
    .then(d => { if (d && d.ok && d.data) { img.onerror = () => { if (!t) fail(); }; img.src = d.data; img.classList.remove('small'); } else if (!t) fail(); }).catch(() => { if (!t) fail(); });
  lb.hidden = false; document.body.style.overflow = 'hidden';
  const close = () => { lb.hidden = true; lb.innerHTML = ''; document.body.style.overflow = ''; };
  lb.onclick = e => { if (e.target === lb || e.target.classList.contains('lbx')) close(); };
  document.addEventListener('keydown', function esc_(e) { if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc_); } });
}
document.addEventListener('click', e => { const a = e.target.closest && e.target.closest('a[data-pid]'); if (!a) return; e.preventDefault(); lightbox(a.dataset.pid, a.dataset.t); });
PC.bar($('#pcbar'), 'Cải thiện');
load();
// 27/11: chiều cao thanh trên cùng → vị trí dính của thanh tab con
const setBarH = () => document.documentElement.style.setProperty('--barh', $('#pcbar').offsetHeight + 'px'); setBarH(); addEventListener('resize', setBarH);
// 27/11: đăng nhập / đăng xuất ở tab khác → trang này tự nhận (không bắt đăng nhập lại); đang sửa dở thì không tải lại
(() => { const who = () => { const u = PC.user(); return u ? u.user + '|' + u.role : ''; }; let seen = who();
  const sync = () => { const w = who(); if (w === seen) return; seen = w; if (Object.keys(edits).length || Object.keys(ownEdit).length) return; PC.bar($('#pcbar'), 'Cải thiện'); load(); };
  addEventListener('storage', e => { if (e.key === 'mqmPcUser' || e.key === null) sync(); }); addEventListener('focus', sync); document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); }); })();
</script>
