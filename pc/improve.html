<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>MQM ORION VINA · Cải thiện</title>
<style>
:root { --red: #c8102e; --ink: #111; --muted: #6b6b6b; --line: #e6e6e6; --soft: #f3f3f3; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: #fff; color: var(--ink); font: 15px/1.45 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
.head { max-width: 1000px; margin: 0 auto; padding: 28px 20px 10px; text-align: center; }
.head .k { color: var(--red); font-weight: 800; font-size: 12px; letter-spacing: .2em; }
.head h1 { font-size: clamp(30px, 5vw, 46px); letter-spacing: -.035em; line-height: 1.08; margin: 10px 0 8px; }
.head p { margin: 0 auto; color: #5f5f5f; font-size: 16px; max-width: 620px; }
.wrap { max-width: 1000px; margin: 0 auto; padding: 10px 16px 80px; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 10px 0 16px; }
.chip { border: 0; background: #efefef; color: #111; border-radius: 999px; padding: 9px 15px; font: inherit; font-weight: 700; font-size: 14px; cursor: pointer; }
.chip.on { background: #111; color: #fff; } .chip small { opacity: .65; margin-left: 4px; font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.kpi { background: #f7f7f7; border-radius: 22px; padding: 14px 16px; } .kpi small { display: block; color: var(--muted); font-weight: 600; font-size: 12.5px; } .kpi b { font-size: 26px; }
.kpi.red b { color: var(--red); }
.note { border: 1.5px solid #ececec; border-radius: 22px; padding: 12px 16px; margin-bottom: 14px; font-size: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.note.key { background: #111; color: #fff; border-color: #111; }
.item { border: 1.5px solid #ececec; border-radius: 28px; padding: 18px 20px; margin-bottom: 12px; }
.item.done { border-color: #111; } .item.late { border-color: #f0c4cc; }
.item .top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.item .top b { font-size: 16px; } .item .top span { color: var(--muted); font-size: 13px; }
.item .what { margin: 8px 0 4px; font-size: 14.5px; }
.item .meta { color: var(--muted); font-size: 13px; margin: 2px 0; } .item .meta i { font-style: normal; color: #111; font-weight: 600; }
.pill { display: inline-block; font-size: 12px; font-weight: 800; padding: 3px 10px; border-radius: 999px; background: #efefef; }
.pill.s0 { background: #fff; color: var(--red); box-shadow: inset 0 0 0 1.5px #f0c4cc; } .pill.s1 { background: #efefef; color: #111; } .pill.s2 { background: #111; color: #fff; }
.pill.late { background: var(--red); color: #fff; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: #f1f1f1; border-radius: 16px; padding: 4px; gap: 4px; margin: 12px 0 10px; }
.seg button { border: 0; background: none; padding: 11px 6px; border-radius: 12px; font: inherit; font-weight: 700; font-size: 14px; color: var(--muted); cursor: pointer; }
.seg button.on { background: #fff; color: #111; box-shadow: 0 1px 4px rgba(0,0,0,.12); } .seg button.on.s2 { background: #111; color: #fff; } .seg button.on.s0 { color: var(--red); }
.label { font-size: 12.5px; font-weight: 700; color: var(--muted); margin: 10px 0 6px; display: block; }
textarea { width: 100%; font: inherit; font-size: 15px; padding: 12px 14px; border: 2px solid #cdcdcd; border-radius: 16px; min-height: 90px; resize: vertical; }
textarea:focus { outline: none; border-color: #0074e8; box-shadow: 0 0 0 4px rgba(0,116,232,.18); }
.ev { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
.ev .f { position: relative; width: 88px; height: 88px; border-radius: 16px; background: #f3f3f3 center/cover; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #555; text-align: center; padding: 6px; overflow: hidden; word-break: break-all; }
.ev .f.new { outline: 2px dashed #111; }
.ev .f button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; cursor: pointer; font-size: 14px; line-height: 1; }
.ev label.add { width: 88px; height: 88px; border-radius: 16px; border: 2px dashed #cdcdcd; display: grid; place-items: center; cursor: pointer; color: var(--muted); font-weight: 700; font-size: 12px; text-align: center; }
.row { display: flex; gap: 10px; justify-content: flex-end; align-items: center; margin-top: 12px; flex-wrap: wrap; } .row small { color: var(--muted); margin-right: auto; }
.btn { border: 0; background: var(--red); color: #fff; font: inherit; font-weight: 700; font-size: 15px; padding: 12px 20px; border-radius: 999px; cursor: pointer; }
.btn:disabled { opacity: .45; cursor: default; } .btn.gray { background: #efefef; color: #111; }
.plan { background: #f7f7f7; border-radius: 16px; padding: 10px 14px; margin-top: 8px; font-size: 14px; white-space: pre-wrap; }
.empty { text-align: center; color: var(--muted); padding: 30px 10px; border: 1.5px solid #ececec; border-radius: 28px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111; color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 99; max-width: 90vw; text-align: center; }
@media (max-width: 760px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .item { padding: 16px; border-radius: 24px; } }
</style>
</head>
<body>
<div class="pc-bar" id="pcbar"></div>
<header class="head"><div class="k">MQM ORION VINA · CẢI THIỆN</div><h1>Tiến độ cải thiện</h1>
  <p id="sub">Sau khi kết thúc đánh giá, mỗi bộ phận nhận mail kèm link vào đây: chọn Chưa / Đang / Đã cải thiện, ghi hướng giải quyết và tải evidence.</p></header>
<main class="wrap" id="app"><div class="empty">Đang tải…</div></main>
<div class="toast" id="toast" hidden></div>
<script src="pc.js?v=20261105"></script>
<script>
// Tab 5 · Cải thiện (anh Thái 05/11/2026). Ai cũng xem. Sửa được khi mở bằng link riêng của bộ phận trong mail (?c=tháng&d=bộ phận&k=khoá)
// hoặc khi đăng nhập Host / quản lý. Evidence: ảnh / PDF lưu vào thư mục Drive "MQM ORION VINA - Evidence" (ảnh có ảnh nhỏ để xem ngay).
const STATUS = ['Chưa cải thiện', 'Đang cải thiện', 'Đã cải thiện'];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const dmy = s => { const m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ''; };
const toast = t => { const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(el._t); el._t = setTimeout(() => { el.hidden = true; }, 4500); };
const url = new URLSearchParams(location.search);
const LINK = { c: url.get('c') || '', d: url.get('d') || '', k: url.get('k') || '' };
// Link bộ phận: giữ khoá trên máy này theo tháng + bộ phận, bỏ khỏi thanh địa chỉ
(() => { if (!LINK.k) { try { const x = JSON.parse(sessionStorage.getItem('mqmImproveKey') || 'null'); if (x) Object.assign(LINK, x); } catch (e) {} return; }
  try { sessionStorage.setItem('mqmImproveKey', JSON.stringify(LINK)); } catch (e) {} history.replaceState(null, '', location.pathname + (LINK.c ? '?c=' + encodeURIComponent(LINK.c) : '')); })();
let D = null, cycle = LINK.c || PC.month(), fDept = LINK.d || '', fSt = 'all', keyDept = '';
const edits = {};   // aid → {status, plan, files:[{name,data,thumb}], remove:[]}
const today = new Date().toISOString().slice(0, 10);
const canEdit = it => (keyDept && keyDept === it.who) || PC.can('improve');
const late = it => it.status !== STATUS[2] && it.when && it.when < today;

// Ảnh: thu nhỏ còn cạnh dài 1600px gửi đi + ảnh nhỏ 200px để xem ngay; PDF gửi nguyên (tối đa 8 MB)
const readAs = f => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
const shrink = (src, max, q) => new Promise(ok => { const im = new Image(); im.onload = () => { const s = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas');
  c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); ok(c.toDataURL('image/jpeg', q)); }; im.onerror = () => ok(''); im.src = src; });
async function prep(f) {
  if (f.type === 'application/pdf') { if (f.size > 8e6) throw new Error(f.name + ' lớn hơn 8 MB'); return { name: f.name, data: await readAs(f), thumb: '' }; }
  if (!/^image\//.test(f.type)) throw new Error(f.name + ': chỉ nhận ảnh hoặc PDF');
  const raw = await readAs(f); return { name: f.name.replace(/\.\w+$/, '') + '.jpg', data: await shrink(raw, 1600, .85), thumb: await shrink(raw, 200, .6) };
}

function card(it) {
  const e = edits[it.aid], st = e ? e.status : it.status, si = STATUS.indexOf(st), ed = canEdit(it), lt = late(it);
  const ev = it.evidence.filter(f => !(e && e.remove.includes(f.id)));
  return `<div class="item ${st === STATUS[2] ? 'done' : lt ? 'late' : ''}" data-aid="${esc(it.aid)}">
    <div class="top"><b>${esc(it.sku || it.sampleId)}</b><span>${esc(it.aid)} · mẫu ${esc(it.sampleId)} · ghi nhận: ${esc(it.from || '—')}</span></div>
    <p class="what">${esc(it.what)}</p>
    ${it.cause ? `<p class="meta">Nguyên nhân nghi ngờ: <i>${esc(it.cause)}</i></p>` : ''}${it.suggest ? `<p class="meta">Giải pháp tạm thời đề xuất: <i>${esc(it.suggest)}</i></p>` : ''}
    <p class="meta">Bộ phận xử lý: <i>${esc(it.who)}</i> · Hạn: <i>${dmy(it.when)}</i> <span class="pill s${si}">${esc(st)}</span>${lt ? ' <span class="pill late">Quá hạn</span>' : ''}</p>
    ${ed ? `<div class="seg" data-st="${esc(it.aid)}">${STATUS.map((s, i) => `<button class="s${i} ${s === st ? 'on' : ''}" data-v="${esc(s)}">${esc(s)}</button>`).join('')}</div>
      <span class="label">Hướng giải quyết</span><textarea data-plan="${esc(it.aid)}" placeholder="VD: QA kiểm lực seal lô 10/2026, đổi màng ghép từ tuần 46…">${esc(e ? e.plan : it.plan)}</textarea>
      <span class="label">Evidence (ảnh / PDF)</span>
      <div class="ev">${ev.map(f => `<div class="f" style="${f.t ? `background-image:url(${f.t})` : ''}" title="${esc(f.n)}">${f.t ? '' : esc(f.n)}<button data-rm="${esc(f.id)}" aria-label="Bỏ">×</button></div>`).join('')}
        ${(e ? e.files : []).map((f, i) => `<div class="f new" style="${f.thumb ? `background-image:url(${f.thumb})` : ''}">${f.thumb ? '' : esc(f.name)}<button data-rmn="${i}" aria-label="Bỏ">×</button></div>`).join('')}
        <label class="add">+ Thêm<br>ảnh / PDF<input type="file" accept="image/*,application/pdf" multiple hidden data-file="${esc(it.aid)}"></label></div>
      <div class="row"><small>${it.updatedAt ? `Cập nhật ${esc(new Date(it.updatedAt).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }))}${it.by ? ' · ' + esc(it.by) : ''}` : ''}</small>
        <button class="btn" data-save="${esc(it.aid)}" ${e ? '' : 'disabled'}>Lưu</button></div>`
    : `${it.plan ? `<div class="plan"><b>Hướng giải quyết:</b> ${esc(it.plan)}</div>` : ''}${ev.length ? `<div class="ev">${ev.map(f => `<div class="f" style="${f.t ? `background-image:url(${f.t})` : ''}" title="${esc(f.n)}">${f.t ? '' : esc(f.n)}</div>`).join('')}</div>` : ''}`}</div>`;
}
function render() {
  const all = D.items, depts = [...new Set(all.map(x => x.who))].sort();
  const pool = all.filter(x => !fDept || x.who === fDept), xs = pool.filter(x => fSt === 'all' || (fSt === 'late' ? late(x) : x.status === fSt));
  const n = s => pool.filter(x => x.status === s).length;
  $('#app').innerHTML = `${keyDept ? `<div class="note key"><span>Bạn đang mở bằng link của bộ phận <b>${esc(keyDept)}</b>: cập nhật được các việc của ${esc(keyDept)}.</span></div>`
      : PC.can('improve') ? '' : `<div class="note"><span>Chỉ xem. Bộ phận mở link trong mail để cập nhật; Host / quản lý đăng nhập để cập nhật.</span><button class="chip" id="login">Đăng nhập</button></div>`}
    <div class="filters">${PC.monthSelect(D.months, D.cycle)}
      <button class="chip ${!fDept ? 'on' : ''}" data-d="">Mọi bộ phận<small>${all.length}</small></button>
      ${depts.map(d => `<button class="chip ${fDept === d ? 'on' : ''}" data-d="${esc(d)}">${esc(d)}<small>${all.filter(x => x.who === d).length}</small></button>`).join('')}</div>
    <div class="kpis"><div class="kpi"><small>Việc cần cải thiện</small><b>${pool.length}</b></div><div class="kpi red"><small>Chưa cải thiện</small><b>${n(STATUS[0])}</b></div>
      <div class="kpi"><small>Đang cải thiện</small><b>${n(STATUS[1])}</b></div><div class="kpi"><small>Đã cải thiện</small><b>${n(STATUS[2])}</b></div><div class="kpi red"><small>Quá hạn</small><b>${pool.filter(late).length}</b></div></div>
    <div class="filters">${[['all', 'Tất cả'], [STATUS[0], STATUS[0]], [STATUS[1], STATUS[1]], [STATUS[2], STATUS[2]], ['late', 'Quá hạn']].map(([v, t]) => `<button class="chip ${fSt === v ? 'on' : ''}" data-s="${esc(v)}">${t}</button>`).join('')}</div>
    ${xs.length ? xs.map(card).join('') : `<div class="empty">${all.length ? 'Không có việc nào theo lựa chọn này.' : `Chưa có việc cải thiện cho ${PC.monthLabel(D.cycle).toLowerCase()}. Việc sẽ hiện sau khi Host / quản lý bấm "Kết thúc đánh giá" ở Report.`}</div>`}`;
  bind();
}
function touch(aid) { const it = D.items.find(x => x.aid === aid); return edits[aid] = edits[aid] || { status: it.status, plan: it.plan, files: [], remove: [] }; }
function bind() {
  const ms = $('#month'); if (ms) ms.onchange = () => { cycle = ms.value; PC.setMonth(cycle); load(); };
  const lg = $('#login'); if (lg) lg.onclick = async () => { const u = await PC.login('Đăng nhập để cập nhật tiến độ'); if (u && !PC.can('improve', u)) toast('Tài khoản này chỉ xem được.'); PC.bar($('#pcbar'), 'Cải thiện'); render(); };
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { fDept = b.dataset.d; render(); });
  document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { fSt = b.dataset.s; render(); });
  const keep = () => { const y = scrollY; render(); scrollTo(0, y); };
  document.querySelectorAll('[data-st]').forEach(sg => sg.querySelectorAll('button').forEach(b => b.onclick = () => { touch(sg.dataset.st).status = b.dataset.v; keep(); }));
  document.querySelectorAll('[data-plan]').forEach(t => t.oninput = () => { touch(t.dataset.plan).plan = t.value; const s = document.querySelector(`[data-save="${t.dataset.plan}"]`); if (s) s.disabled = false; });
  document.querySelectorAll('[data-file]').forEach(inp => inp.onchange = async () => {
    const e = touch(inp.dataset.file);
    for (const f of [...inp.files].slice(0, 5)) { try { e.files.push(await prep(f)); } catch (x) { toast(x.message); } }
    keep();
  });
  document.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const aid = b.closest('.item').dataset.aid; touch(aid).remove.push(b.dataset.rm); keep(); });
  document.querySelectorAll('[data-rmn]').forEach(b => b.onclick = () => { const aid = b.closest('.item').dataset.aid; touch(aid).files.splice(+b.dataset.rmn, 1); keep(); });
  document.querySelectorAll('[data-save]').forEach(b => b.onclick = async () => {
    const aid = b.dataset.save, e = edits[aid]; if (!e) return;
    b.disabled = true; b.textContent = e.files.length ? 'Đang tải evidence…' : 'Đang lưu…';
    try {
      const r = await PC.post('actionUpdate', { cycle: D.cycle, aid, status: e.status, plan: e.plan, files: e.files, remove: e.remove, k: keyDept ? LINK.k : '', name: keyDept });
      if (!r.ok) throw new Error(r.error);
      D.items = D.items.map(x => x.aid === aid ? r.item : x); delete edits[aid]; toast('Đã lưu ' + aid); keep();
    } catch (x) { b.disabled = false; b.textContent = 'Lưu'; toast('Chưa lưu được: ' + x.message); }
  });
}
async function load() {
  $('#app').innerHTML = '<div class="empty">Đang tải…</div>';
  try {
    const q = (cycle ? '&cycle=' + encodeURIComponent(cycle) : '') + (LINK.d && LINK.k && (!LINK.c || LINK.c === cycle) ? '&d=' + encodeURIComponent(LINK.d) + '&k=' + encodeURIComponent(LINK.k) : '');
    D = await PC.get('actions' + q); if (!D.ok) throw new Error(D.error);
    cycle = D.cycle; keyDept = D.dept || '';
    $('#sub').textContent = `${PC.monthLabel(D.cycle)}${D.ended ? ` · kết thúc đánh giá ${dmy(D.ended)}` : ''}. Chọn Chưa / Đang / Đã cải thiện, ghi hướng giải quyết và tải evidence.`;
    render();
  } catch (x) { $('#app').innerHTML = `<div class="empty">Không tải được (${esc(x.message)}). Kiểm tra mạng rồi tải lại trang.</div>`; }
}
PC.bar($('#pcbar'), 'Cải thiện');
load();
</script>
</body>
</html>
